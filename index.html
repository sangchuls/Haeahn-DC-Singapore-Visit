</script>
<style>
:root{--acc:#1a3a5c;--acc2:#c8a84b;--bg:#f5f2ed;--card:#fff;
  --text:#1a1a1a;--t2:#555;--t3:#999;--bdr:#e8e2d9;
  --grn:#1e7e5a;--org:#c45e0a;--blu:#1255a0;--red:#a82020;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0)}
/* HEADER */
#hdr{background:var(--acc);flex-shrink:0;z-index:200}
.ht{display:flex;align-items:center;justify-content:space-between;padding:9px 13px 5px}
.ht-t{font-size:13px;font-weight:700;color:#fff}
.ht-s{font-size:9px;color:rgba(255,255,255,.6);margin-top:1px}
.hbg{border-radius:20px;padding:3px 9px;font-size:10px;font-weight:700;color:#fff}
.dtabs{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.12)}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;padding:6px 11px;border:none;background:none;cursor:pointer;
  font-size:11px;font-weight:600;color:rgba(255,255,255,.5);
  border-bottom:2.5px solid transparent;white-space:nowrap;line-height:1.3;
  display:flex;flex-direction:column;align-items:center}
.dtab small{font-size:9px;opacity:.7;margin-top:1px}
.dtab.on{color:#fff;border-bottom-color:var(--acc2)}
.dtab-ck{position:relative}
.dtab-ck::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;
  border-radius:50%;background:var(--acc2)}
.dtab-ck.ck-clear::after{display:none}
/* MAP */
#mapWrap{flex-shrink:0;height:36%;position:relative;background:#e8e4dc;z-index:1;isolation:isolate}
#map{width:100%;height:100%}
body.panel-open .leaflet-control-container{pointer-events:none;opacity:.35}
#lgd{position:absolute;bottom:6px;left:6px;z-index:500;
  background:rgba(26,58,92,.82);border-radius:8px;padding:5px 9px;
  display:flex;gap:8px;backdrop-filter:blur(4px)}
.lg{display:flex;align-items:center;gap:3px;font-size:9px;color:#fff}
.lg-l{width:16px;height:3px;border-radius:2px}
.map-notice{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;background:#eceae4;padding:20px;text-align:center}
.mn-icon{font-size:30px;opacity:.35}
.mn-title{font-size:13px;font-weight:700;color:var(--t2)}
.mn-sub{font-size:11px;color:var(--t3);line-height:1.6;max-width:260px}
/* CONTENT */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ci{padding:12px 13px 50px}
/* DAY HERO */
.dhero{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dh-t{font-size:17px;font-weight:800;color:var(--acc)}
.dh-s{font-size:10px;color:var(--t3);margin-top:2px}
.dbg{border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;color:#fff}
/* STEP */
.step{background:var(--card);border-radius:13px;border:1px solid var(--bdr);margin-bottom:9px;overflow:hidden}
.step-h{display:flex;gap:9px;padding:11px 13px;cursor:pointer;align-items:flex-start}
.stime{font-size:10px;color:var(--t3);font-weight:600;min-width:36px;padding-top:3px;font-variant-numeric:tabular-nums}
.sdot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
.dt{background:var(--blu)}.de{background:var(--grn)}.dtr{background:var(--org)}.ds{background:var(--red)}.df{background:#aaa}
.smain{flex:1}
.si{font-size:17px;margin-bottom:2px}
.stt{font-size:13px;font-weight:700;color:var(--acc);line-height:1.3}
.sloc{font-size:11px;color:var(--t2);margin-top:2px}
.swarn{font-size:11px;color:var(--org);font-weight:700;margin-top:3px}
.schips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:10px;font-weight:600;padding:2px 6px;border-radius:10px}
.cb{background:#e3eef9;color:#1255a0}.cg{background:#e0f2ea;color:#1e7e5a}
.co{background:#fef0e3;color:#c45e0a}.cr{background:#fce8e8;color:#a82020}.ck{background:#f0ede8;color:#555}
/* DETAIL */
.sdet{display:none;padding:0 13px 13px;border-top:1px solid var(--bdr)}
.sdet.open{display:block}
.dsec{margin-top:10px}
.dslbl{font-size:9px;font-weight:800;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.dsbody{font-size:12px;color:var(--text);line-height:1.75}
/* TRANSPORT */
.tropts{display:flex;flex-direction:column;gap:6px;margin-top:5px}
.tropt{background:#f8f6f2;border-radius:9px;padding:9px 11px;
  border:1.5px solid var(--bdr);cursor:pointer;transition:all .15s}
.tropt.sel{border-color:var(--acc);background:#edf2fa}
.tropt:active{opacity:.8}
.trh{display:flex;align-items:center;gap:6px;margin-bottom:0}
.trbg{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff}
.trn{font-size:12px;font-weight:700;color:var(--acc)}
.trarr{margin-left:auto;font-size:11px;color:var(--t3);transition:transform .2s}
.tropt.sel .trarr{transform:rotate(90deg);color:var(--acc)}
.trbody{font-size:11px;color:var(--t2);line-height:1.65;display:none;
  margin-top:7px;border-top:1px solid var(--bdr);padding-top:6px}
.tropt.sel .trbody{display:block}
.maprbtn{display:inline-flex;align-items:center;gap:4px;margin-top:7px;
  background:var(--acc);color:#fff;border:none;border-radius:8px;
  padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer}
.tipbox{background:linear-gradient(135deg,#fffbf0,#fff8e8);
  border:1.5px solid #e8c96e;border-radius:9px;padding:9px 11px;margin-top:8px}
.tiplbl{font-size:9px;font-weight:800;color:#9a7420;margin-bottom:3px}
.tipbody{font-size:12px;color:var(--text);line-height:1.7;white-space:pre-line}
.mapbtn{display:flex;align-items:center;justify-content:center;gap:5px;
  width:100%;margin-top:9px;padding:10px;border-radius:9px;border:none;
  background:var(--acc);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
/* 네비게이션 버튼 그룹 */
.nav-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.nbtn{flex:1;min-width:0;padding:8px 4px;border:none;border-radius:9px;
  font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.nbtn:active{opacity:.8}
.nbtn-map{background:var(--acc);color:#fff}
.nbtn-google{background:#4285f4;color:#fff}
.nbtn-grab{background:#00b14f;color:#fff}
/* AI 시뮬레이션 패널 */
#sim-panel{
  position:fixed;inset:0;z-index:2100;
  background:rgba(5,10,20,.8);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;
}
#sim-panel.show{display:flex;}
#sim-box{
  width:100%;background:#0f1923;border-radius:22px 22px 0 0;
  max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.5);
  animation:slideUp .35s cubic-bezier(.32,.72,0,1);
  padding-bottom:env(safe-area-inset-bottom,0);
}
#sim-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;
  background:linear-gradient(135deg,#1a2744,#0f1923);
  border-radius:22px 22px 0 0;
}
.sim-title{font-size:15px;font-weight:800;color:#fff}
.sim-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px}
#sim-scroll{overflow-y:auto;flex:1;padding:14px 14px 24px;background:#0f1923}
/* 로딩 */
.sim-loading-box{text-align:center;padding:40px 20px}
.sim-spinner{
  width:36px;height:36px;border:3px solid rgba(200,168,75,.2);
  border-top-color:#c8a84b;border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 14px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.sim-loading-text{font-size:13px;font-weight:700;color:#c8a84b;margin-bottom:4px}
.sim-loading-sub{font-size:11px;color:rgba(255,255,255,.4)}
/* 시나리오 카드 */
.sim-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;margin-bottom:12px;overflow:hidden;
}
.sim-card-head{
  display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;
}
.sim-card-icon{font-size:22px;flex-shrink:0}
.sim-card-title{font-size:13px;font-weight:700;color:#fff;flex:1}
.sim-card-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap}
.sim-card-arr{font-size:11px;color:rgba(255,255,255,.35);transition:transform .2s}
.sim-card.open .sim-card-arr{transform:rotate(90deg)}
.sim-card-body{display:none;padding:0 13px 13px;border-top:1px solid rgba(255,255,255,.07)}
.sim-card.open .sim-card-body{display:block}
/* 대화 버블 */
.sim-dialog{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.sim-bubble{
  max-width:85%;padding:8px 11px;border-radius:13px;
  font-size:11px;line-height:1.65;
}
.sim-bubble.left{
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);
  border-radius:4px 13px 13px 13px;align-self:flex-start;
}
.sim-bubble.right{
  background:#c8a84b;color:#fff;
  border-radius:13px 4px 13px 13px;align-self:flex-end;
  font-weight:600;
}
.sim-bubble-who{font-size:9px;font-weight:700;margin-bottom:3px;opacity:.6}
.sim-tip{
  background:rgba(200,168,75,.12);border:1px solid rgba(200,168,75,.3);
  border-radius:10px;padding:9px 11px;margin-top:8px;
}
.sim-tip-lbl{font-size:9px;font-weight:800;color:#c8a84b;margin-bottom:3px;letter-spacing:.05em}
.sim-tip-body{font-size:11px;color:rgba(255,255,255,.75);line-height:1.65;white-space:pre-line}
.sim-warn{
  background:rgba(255,100,50,.1);border:1px solid rgba(255,100,50,.3);
  border-radius:10px;padding:8px 11px;margin-top:8px;
}
.sim-warn-lbl{font-size:9px;font-weight:800;color:#ff7755;margin-bottom:3px}
.sim-warn-body{font-size:11px;color:rgba(255,255,255,.7);line-height:1.6;white-space:pre-line}
.sim-source{font-size:10px;color:rgba(255,255,255,.4);text-align:center;
  padding:5px 0 10px;letter-spacing:.02em}

// ── 경로 그리기 ─────────────────────────────────────────────
function archLine(from,to){
  // 두 점 사이 곡선 경유점 생성
  const pts=[];
  const steps=20;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const lat=from[0]+(to[0]-from[0])*t;
    const lng=from[1]+(to[1]-from[1])*t;
    // 중간 지점에서 약간 위로 올려 곡선 효과
    const arc=Math.sin(t*Math.PI)*0.03;
    pts.push([lat+arc,lng]);
  }
  return pts;
}

// 진행 중인 애니메이션을 즉시 끝내고 정리

// line을 pts를 따라 순차적으로 그린다
//
// follow=true 일 때는 구간 단위로 진행한다:
//   ① 카메라가 그 구간이 화면에 꽉 차도록 부드럽게 이동 (flyToBounds)
//   ② 카메라를 멈춘 채로 그 구간의 선을 그린다
//   ③ 잠깐 쉬고 다음 구간으로
// 그리는 동안 지도를 건드리지 않기 때문에 화면이 깜빡이지 않는다.
// (매 프레임 setView로 줌을 다시 먹이면 타일이 매번 다시 깔려 깜빡인다)
//
//   opts.perSeg   구간 하나를 그리는 시간 ms
//   opts.maxMs    선 그리는 시간 총합 상한
//   opts.flyDur   구간 전환 카메라 이동 시간 (초)
//   opts.dwell    구간 사이 멈춤 ms
//   opts.maxZoom  카메라가 들어갈 수 있는 최대 줌
//   opts.head     선두 마커
//   opts.onReach(i) / opts.onDone()
function animatePath(line, pts, opts){
  opts = opts || {};
  var onReach = opts.onReach || function(){};
  var onDone  = opts.onDone  || function(){};
  var head    = opts.head || null;
  var n = pts.length;

  cancelRouteAnim();

  var follow = !!opts.follow && !prefersStill() && n >= 2 && mapReady;
  var userMoved = false;
  function stopFollow(){ userMoved = true; }

  var done = false, reached = 0, timers = [];
  var handle = {
    raf: null, timers: timers,
    finish: function(){
      if(done) return;
      done = true;
      for(var t=0;t<timers.length;t++) clearTimeout(timers[t]);
      timers.length = 0;
      try{ line.setLatLngs(pts); }catch(e){}
      while(reached < n-1){ reached++; onReach(reached); }
      if(head && map && map.hasLayer(head)) map.removeLayer(head);
      if(follow){
        map.off('dragstart', stopFollow);
        if(!userMoved){
          try{
            var bb = L.latLngBounds(pts).pad(0.2);
            var bz = map.getBoundsZoom(bb, false);
            // 도시 규모면 전체 동선을 한눈에, 국제선처럼 범위가 너무 넓으면
            // 줌아웃하지 않고 도착지를 가까이 보여준 채로 끝낸다
            if(bz >= (opts.overviewMinZoom||9)){
              map.flyToBounds(bb,{duration:(opts.flyDur||1.2)});
            } else {
              map.flyTo(pts[n-1], (opts.endZoom||11), {duration:(opts.flyDur||1.2)});
            }
          }catch(e){}
        }
      }
      onDone();
    }
  };

  if(n < 2){ routeAnim = handle; handle.finish(); routeAnim = null; return; }

  routeAnim = handle;
  line.setLatLngs([pts[0]]);
  onReach(0);

  if(prefersStill()){ handle.finish(); routeAnim = null; return; }

  // 구간 하나를 그리는 시간 — 지점이 많으면 총합 상한에 맞춰 줄인다
  var perSeg = opts.perSeg || 380;
  var cap = opts.maxMs || 0;
  if(cap && perSeg * (n-1) > cap) perSeg = cap / (n-1);
  var flyDur = opts.flyDur || 1.2;
  var dwell  = (opts.dwell === undefined) ? 240 : opts.dwell;

  // ── follow 아님: 카메라 그대로 두고 한 번에 그린다 ──
  if(!follow){
    var total = opts.total || perSeg * (n-1);
    var start0 = null;
    function flat(ts){
      if(routeAnim !== handle) return;
      if(start0 === null) start0 = ts;
      var t = Math.min((ts - start0)/total, 1);
      var e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      var fp = e*(n-1), i = Math.min(Math.floor(fp), n-2), f = fp - i;
      var cur = pts.slice(0, i+1);
      cur.push([pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f]);
      try{ line.setLatLngs(cur); }catch(err){ handle.finish(); routeAnim=null; return; }
      if(head) head.setLatLng(cur[cur.length-1]);
      while(reached < i){ reached++; onReach(reached); }
      if(t < 1) handle.raf = requestAnimationFrame(flat);
      else { handle.finish(); routeAnim = null; }
    }
    handle.raf = requestAnimationFrame(flat);
    return;
  }

  // ── follow: 구간 단위 ──
  map.on('dragstart', stopFollow);

  // 카메라를 구간 k가 꽉 차도록 옮긴다
  function moveCam(k, cb){
    if(userMoved || routeAnim !== handle){ cb(); return; }
    try{
      map.flyToBounds(L.latLngBounds([pts[k], pts[k+1]]).pad(0.35),
        {duration: flyDur, maxZoom: (opts.maxZoom||16)});
    }catch(e){ cb(); return; }
    timers.push(setTimeout(cb, flyDur*1000 + 140));
  }

  // 구간 k의 선을 그린다 — 이 동안 지도는 건드리지 않는다
  function drawSeg(k, cb){
    var start = null;
    function fr(ts){
      if(routeAnim !== handle) return;
      if(start === null) start = ts;
      var t = Math.min((ts - start)/perSeg, 1);
      var e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      var cur = pts.slice(0, k+1);
      cur.push([pts[k][0]+(pts[k+1][0]-pts[k][0])*e, pts[k][1]+(pts[k+1][1]-pts[k][1])*e]);
      try{ line.setLatLngs(cur); }catch(err){ handle.finish(); routeAnim=null; return; }
      if(head) head.setLatLng(cur[cur.length-1]);
      if(t < 1){ handle.raf = requestAnimationFrame(fr); }
      else { reached = k+1; onReach(k+1); cb(); }
    }
    handle.raf = requestAnimationFrame(fr);
  }

  var seg = 0;
  function step(){
    if(routeAnim !== handle) return;
    if(seg >= n-1){ handle.finish(); routeAnim = null; return; }
    var k = seg++;
    moveCam(k, function(){
      if(routeAnim !== handle) return;
      drawSeg(k, function(){
        if(routeAnim !== handle) return;
        timers.push(setTimeout(step, dwell));
      });
    });
  }
  step();
}

// 이전 동선 보관 — 상한 초과 시 가장 오래된 것부터 제거
function pushPastLine(latlngs){
  if(!mapReady||typeof L==='undefined'||!map) return;
  var f = L.polyline(latlngs,{color:'#888',weight:2,opacity:0.25,lineCap:'round'}).addTo(map);
  pastLines.push(f);
  while(pastLines.length > PAST_LINE_MAX){
    var old = pastLines.shift();
    if(old && map.hasLayer(old)) map.removeLayer(old);
  }
}

function drawRoute(trObj){
  if(!mapReady||!trObj) return;
  if(!Array.isArray(trObj.from)||!Array.isArray(trObj.to)){alert('터미널 좌표는 등록되어 있지 않습니다. 구글맵에서 확인된 터미널 이름으로 길찾기를 이용하세요.');return;}
  const from=trObj.from, to=trObj.to;
  const isSamePoint=(from[0]===to[0]&&from[1]===to[1]);
  if(isSamePoint) return;

  // 이전 현재 경로 → 과거로 이동
  cancelRouteAnim();
  if(curLine){
    pushPastLine(curLine.getLatLngs());
    map.removeLayer(curLine); curLine=null;
  }

  const isLong=(Math.abs(from[0]-to[0])>1||Math.abs(from[1]-to[1])>1);
  const coords=isLong?archLine(from,to):[[from[0],from[1]],[to[0],to[1]]];

  const color=trObj.bc||'#ff6b35';
  const dash=trObj.mode==='transit'?'8,5':null;
  curLine=L.polyline([coords[0]],{color,weight:5,opacity:0.9,dashArray:dash,lineCap:'round',lineJoin:'round'}).addTo(map);

  // 출발 마커 먼저, 도착 마커는 선이 닿을 때
  curMarkers.forEach(m=>map.removeLayer(m)); curMarkers=[];
  curMarkers.push(pinIcon(from[0],from[1],'🔵','출발',color,['출발','Start']));

  animatePath(curLine, coords, {
    perSeg: isLong ? 1800 : 1400,
    follow: true, maxZoom: 15, flyDur: 1.6, dwell: 0,
    head: makeHead(color, coords[0]),
    onReach: function(i){
      if(i === coords.length-1){
        curMarkers.push(pinIcon(to[0],to[1],'🔴',trObj.map_pin_usage==='reference_only'?'참고 위치':'도착',color,trObj.map_pin_usage==='reference_only'?['참고 위치 · 미확정','Reference only']:['도착','Arrive']));
      }
    }
  });
}

function pinIcon(lat,lng,dot,lbl,color,label){
  if(!mapReady||typeof L==='undefined'||!map) return null;
  const ic=L.divIcon({className:'',
    html:pinHTML(dot,color,label),
    iconSize:[28,28],iconAnchor:[14,14]});
  return L.marker([lat,lng],{icon:ic}).bindPopup(`<b style="font-size:11px">${lbl}</b>`).addTo(map);
}

function flyTo(lat,lng,zoom){ if(mapReady && Number.isFinite(lat) && Number.isFinite(lng)) map.flyTo([lat,lng],zoom||14,{animate:true,duration:0.7}); }

// ── 탭 ─────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  initMap();
  buildTabs();
  ckLoad();
  renderDay(0);
});

function buildTabs(){
  const c=document.getElementById('dtabs');
  DAYS.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='dtab'+(i===0?' on':'');
    b.innerHTML=d.date+'<small>'+d.wd+' '+d.badge.split(' ')[0]+'</small>';
    if(d.checklist) b.classList.add('dtab-ck');
    b.onclick=()=>switchDay(i);
    c.appendChild(b);
  });
}

function switchDay(i){
  // 현재 경로 → 흐리게 보존
  cancelRouteAnim();
  if(mapReady && curLine){
    pushPastLine(curLine.getLatLngs());
    map.removeLayer(curLine); curLine=null;
  }
  curDay=i;
  document.querySelectorAll('.dtab').forEach((t,j)=>t.classList.toggle('on',j===i));
  renderDay(i);
}

// ── 렌더 ────────────────────────────────────────────────────
function renderDay(i){
  const d=DAYS[i];
  document.getElementById('hBadge').textContent=d.badge;
  document.getElementById('hBadge').style.background=d.bc;
  const ci=document.getElementById('ci');
  ci.innerHTML='';
  FieldAssistant.overview(ci);

  // 준비 체크리스트 탭 — 지도 대신 체크리스트만
  if(d.checklist){
    document.getElementById('mapWrap').style.display='none';
    renderChecklist(ci);
    return;
  }
  // 학습노트 탭 — 지도 없이 PIN 보호 본문만
  if(d.study){
    document.getElementById('mapWrap').style.display='none';
    renderStudy(ci);
    return;
  }
  document.getElementById('mapWrap').style.display='';
  if(mapReady && map) map.invalidateSize();
  flyTo(d.lat,d.lng,d.zoom||12);

  // 맛집 탭 — 지도는 쓰되 일정 대신 맛집 목록
  if(d.food){
    renderFood(ci);
    return;
  }

  // hero
  const h=mk('div','dhero');
  h.innerHTML='<div><div class="dh-t">'+d.title+'</div><div class="dh-s">'+d.sub+'</div></div>'
    +'<div class="dbg" style="background:'+d.bc+'">'+d.badge+'</div>';
  ci.appendChild(h);
  // 버튼 행 (월요일 제외)
  if(!d.monday){
    var btnRow=mk('div','day-btn-row');
    var pb=mk('button','preview-btn');
    pb.innerHTML='📍 경로 미리보기';
    (function(di){pb.addEventListener('click',function(){openPreview(di);});})(i);
    var sb=mk('button','sim-launch-btn');
    sb.innerHTML='🤖 AI 시나리오';
    (function(di){sb.addEventListener('click',function(){openSim(di);});})(i);
    btnRow.appendChild(pb);
    btnRow.appendChild(sb);
    ci.appendChild(btnRow);
  }
  if(d.monday) renderMonday(ci,d);
  else d.items.forEach((it,idx)=>ci.appendChild(buildStep(it,idx)));
}

function buildStep(it,idx){
  const card=mk('div','step');
  const chips=(it.chips||[]).map(function(ch){return '<span class="chip c'+ch.c+'">'+ch.t+'</span>';}).join('');
  const warn=it.warn?'<div class="swarn">'+it.warn+'</div>':'';
  const chipsHtml=chips?'<div class="schips">'+chips+'</div>':'';
  card.innerHTML='<div class="step-h">'
    +'<span class="stime">'+it.time+'</span>'
    +'<div class="sdot '+(DOT_CLASS[it.type]||'df')+'"></div>'
    +'<div class="smain">'
    +'<div class="si">'+it.icon+'</div>'
    +'<div class="stt">'+it.title+'</div>'
    +'<div class="sloc">📍 '+it.loc+'</div>'
    +warn+chipsHtml
    +'</div></div>';

  // detail
  const dp=mk('div','sdet');
  dp.innerHTML=buildDetailHTML(it);
  card.appendChild(dp);
  card.querySelector('.step-h').addEventListener('click',()=>{
    const open=dp.classList.toggle('open');
    if(open){
      flyTo(it.lat,it.lng,it.zoom||15);
      if(it.trKey) buildTransportDOM(it.trKey);
    }
  });
  return card;
}

function buildDetailHTML(it){
  // 섹션들 — 텍스트만 (교통수단은 아래 DOM 방식으로)
  let h=it.verification_status==='unverified'?'<div class="swarn">'+esc(it.verification_note||'미확정 정보 — 안내 확인 필요')+'</div>':'';
  (it.secs||[]).forEach(s=>{
    h+='<div class="dsec"><div class="dslbl">'+s.t+'</div>'
      +'<div class="dsbody" style="white-space:pre-line">'+s.b+'</div></div>';
  });
  // 교통수단 플레이스홀더 — 나중에 DOM으로 채움
  const trs=it.trKey?TR[it.trKey]:null;
  if(trs&&trs.length){
    h+='<div class="dsec"><div class="dslbl">교통편 — 탭하면 경로 표시 · 버튼으로 앱 연동</div>'
      +'<div class="tropts" id="tropts_'+it.trKey+'"></div></div>';
  }
  if(it.tip){
    h+='<div class="tipbox"><div class="tiplbl">💡 실전 팁</div>'
      +'<div class="tipbody">'+it.tip+'</div></div>';
  }
  if(it.mapQ && it.map_pin_usage!=='reference_only'){
    var enc=encodeURIComponent(it.mapQ);
    h+='<button class="mapbtn" onclick="window.open(\'https://www.google.com/maps/search/?api=1&query='+enc+'\',\'_blank\')">🗺️ 구글맵에서 보기</button>';
  }
  return h;
}

// 교통수단 DOM 빌드 — innerHTML 중첩 백틱 없이 createElement로
function buildTransportDOM(trKey){
  const wrap=document.getElementById('tropts_'+trKey);
  if(!wrap||wrap.children.length>0) return; // 이미 빌드됨
  const trs=TR[trKey];
  if(!trs) return;
  trs.forEach(function(tr){
    const uid='tropt_'+trKey+'_'+tr.id;
    // 카드 외부
    const card=document.createElement('div');
    card.className='tropt'; card.id=uid;
    // 헤더 행
    const head=document.createElement('div'); head.className='trh';
    const badge=document.createElement('span'); badge.className='trbg';
    badge.style.background=tr.bc; badge.textContent=tr.badge;
    const name=document.createElement('span'); name.className='trn'; name.textContent=tr.name;
    const arr=document.createElement('span'); arr.className='trarr'; arr.textContent='▶';
    head.appendChild(badge); head.appendChild(name); head.appendChild(arr);
    // 바디
    const body=document.createElement('div'); body.className='trbody';
    const desc=document.createElement('div');
    desc.style.cssText='white-space:pre-line;font-size:11px;line-height:1.65;color:#444;margin-bottom:8px';
    desc.textContent=tr.body;
    body.appendChild(desc);
    // 버튼 그룹
    const btns=document.createElement('div'); btns.className='nav-btns';
    // 앱내 경로 버튼
    const b1=document.createElement('button'); b1.className='nbtn nbtn-map';
    b1.textContent='🗺️ 앱내 경로';
    if(!Array.isArray(tr.from)||!Array.isArray(tr.to)){b1.disabled=true;b1.textContent='정확한 좌표 미등록';}
    b1.addEventListener('click',function(e){e.stopPropagation();handleRoute(uid,trKey,tr.id);});
    btns.appendChild(b1);
    // 구글맵 네비 버튼
    const b2=document.createElement('button'); b2.className='nbtn nbtn-google';
    b2.textContent='🔵 구글맵 네비';
    if(tr.map_pin_usage==='reference_only'){b2.disabled=true;b2.textContent='목적지 확인 필요';}
    b2.addEventListener('click',function(e){e.stopPropagation();openGoogleNav(trKey,tr.id);});
    btns.appendChild(b2);
    // Grab 버튼 (Grab인 경우만)
    if(tr.id==='grab'){
      const b3=document.createElement('button'); b3.className='nbtn nbtn-grab';
      b3.textContent='🚗 Grab 열기';
      if(tr.map_pin_usage==='reference_only'||!Array.isArray(tr.to)){b3.disabled=true;b3.textContent=tr.destination_query?'Grab에서 T2 직접 선택':'터미널 확인 필요';}
      b3.addEventListener('click',function(e){e.stopPropagation();openGrab(trKey);});
      btns.appendChild(b3);
    }
    body.appendChild(btns);
    card.appendChild(head); card.appendChild(body);
    // 카드 클릭 → 펼치기/접기
    card.addEventListener('click',function(){
      const isOpen=card.classList.contains('sel');
      wrap.querySelectorAll('.tropt').forEach(function(c){c.classList.remove('sel');});
      if(!isOpen) card.classList.add('sel');
    });
    wrap.appendChild(card);
  });
}

// 교통수단 경로 그리기
function handleRoute(uid,trKey,trId){
  const trs=TR[trKey];
  if(!trs) return;
  const tr=trs.find(function(t){return t.id===trId;});
  if(tr) drawRoute(tr);
}

// 구글맵 길찾기 URL 만들기
function gmapDir(from, to, mode){
  return 'https://www.google.com/maps/dir/?api=1'
    + '&origin=' + from[0] + ',' + from[1]
    + '&destination=' + to[0] + ',' + to[1]
    + '&travelmode=' + (mode || 'driving');
}

// 여러 지점을 한 번에 — 경유지 포함 전체 경로
function gmapMulti(pts, mode){
  if(!pts || pts.length < 2) return null;
  var o = pts[0], d = pts[pts.length - 1];
  var mid = pts.slice(1, -1);
  // 구글맵 api=1은 경유지 최대 9개
  if(mid.length > 9) {
    var step = Math.ceil(mid.length / 9);
    mid = mid.filter(function(_, i){ return i % step === 0; }).slice(0, 9);
  }
  var url = 'https://www.google.com/maps/dir/?api=1'
    + '&origin=' + o[0] + ',' + o[1]
    + '&destination=' + d[0] + ',' + d[1]
    + '&travelmode=' + (mode || 'driving');
  if(mid.length) url += '&waypoints=' + encodeURIComponent(
    mid.map(function(p){ return p[0] + ',' + p[1]; }).join('|'));
  return url;
}

function renderMondayBody(ci,day){
  document.querySelectorAll('.rcon').forEach(e=>e.remove());
  document.querySelectorAll('.rtab').forEach((b,i)=>b.classList.toggle('on',day.routes[i].id===curRoute));
  const route=day.routes.find(r=>r.id===curRoute);
  const wrap=mk('div','rcon');

  // ── 배너 ──
  const ban=mk('div','rbanner');
  ban.style.background=`linear-gradient(135deg,${route.color}ee,${route.color}88)`;
  ban.innerHTML=`<div class="rbt">${route.name}</div>
    <div class="rbm">⏱ ${route.time} · 🚶 ${route.dist} · ${route.desc}</div>`;

  const btnRow = mk('div','rban-btns');
  const btn=document.createElement('button');
  btn.className='rroute-btn';
  btn.textContent='🗺️ 앱 지도에 그리기';
  btn.onclick=()=>drawMondayAll(route);
  btnRow.appendChild(btn);

  const gbtn=document.createElement('button');
  gbtn.className='rb-gmap';
  gbtn.textContent='🔵 구글맵 전체 경로';
  gbtn.onclick=function(){
    var pts = route.spots.map(function(s){ return [s.lat, s.lng]; });
    var url = gmapMulti(pts, route.gmode || 'driving');
    if(url) window.open(url, '_blank');
  };
  btnRow.appendChild(gbtn);
  ban.appendChild(btnRow);
  wrap.appendChild(ban);
  flyTo(route.lat,route.lng,13);

  // ── 스팟 카드 ──
  route.spots.forEach(function(sp, idx){
    const card=mk('div','spot');
    card.innerHTML=`<div class="sphead">
      <div class="spnum" style="background:${route.color}">${sp.num}</div>
      <div><div class="spname">${sp.icon} ${sp.name}</div>
      <div class="spsub">🕐 ${sp.time} · ⏱ ${sp.dur} · 🚶 ${sp.how}</div></div></div>`;
    const dp=mk('div','spdet');
    const mq=encodeURIComponent(sp.name+' Singapore');
    dp.innerHTML=`<div class="dsbody" style="margin-bottom:7px;white-space:pre-line">${sp.desc}</div>
      <div class="tipbox"><div class="tiplbl">💡 실전 팁</div>
      <div class="tipbody">${sp.tip}</div></div>`;

    // 이 지점으로 오는 구간 길찾기 (첫 지점 제외)
    if(idx > 0){
      const prev = route.spots[idx-1];
      const leg = mk('div','leg');
      const from = [prev.lat, prev.lng], to = [sp.lat, sp.lng];
      leg.innerHTML = '<div class="leg-h"><div class="leg-l">이 구간 길찾기</div></div>'
        + '<div class="leg-from"><b>' + prev.name + '</b> → <b>' + sp.name + '</b><br>'
        + '앱 안내: ' + sp.how + '</div>';
      const lb = mk('div','leg-btns');

      const modes = route.gmode === 'bicycling'
        ? [['🚲 자전거','bicycling','lb-bike'], ['🚗 Grab','driving','lb-car'], ['🚶 도보','walking','lb-walk']]
        : [['🚗 Grab','driving','lb-car'], ['🚇 MRT·버스','transit','lb-transit'], ['🚶 도보','walking','lb-walk']];

      modes.forEach(function(m){
        const b = document.createElement('button');
        b.className = 'leg-btn ' + m[2];
        b.textContent = m[0];
        b.addEventListener('click', function(e){
          e.stopPropagation();
          window.open(gmapDir(from, to, m[1]), '_blank');
        });
        lb.appendChild(b);
      });
      leg.appendChild(lb);

      const note = mk('div','leg-note');
      note.textContent = route.gmode === 'bicycling'
        ? '자전거 경로는 구글맵이 공원·전용도로를 우선해 안내합니다. 차도 구간이 나오면 프롬나드로 우회하세요.'
        : 'Grab은 앱에서 목적지를 직접 입력해도 됩니다. MRT는 환승 안내까지 나옵니다.';
      leg.appendChild(note);
      dp.appendChild(leg);
    }

    // 장소 자체 보기
    const mb = document.createElement('button');
    mb.className = 'mapbtn';
    mb.style.marginTop = '9px';
    mb.textContent = '🗺️ 이 장소 구글맵에서 보기';
    mb.addEventListener('click', function(e){
      e.stopPropagation();
      window.open('https://www.google.com/maps/search/?api=1&query=' + mq, '_blank');
    });
    dp.appendChild(mb);

    card.appendChild(dp);
    card.querySelector('.sphead').addEventListener('click',()=>{
      const open=dp.classList.toggle('open');
      if(open) flyTo(sp.lat,sp.lng,16);
    });
    wrap.appendChild(card);
  });
  ci.appendChild(wrap);
}

function drawMondayAll(route){
  if(!mapReady||typeof L==='undefined'||!map) return;
  cancelRouteAnim();
  if(curLine){map.removeLayer(curLine);curLine=null;}
  curMarkers.forEach(m=>map.removeLayer(m)); curMarkers=[];
  const pts=route.spots.map(s=>[s.lat,s.lng]);
  if(!pts.length) return;

  curLine=L.polyline([pts[0]],{color:route.color,weight:4,opacity:0.85,lineCap:'round',lineJoin:'round'}).addTo(map);
  animatePath(curLine, pts, {
    perSeg: 1900, maxMs: 6500,
    follow: true, maxZoom: 16, flyDur: 1.3, dwell: 200,
    head: makeHead(route.color, pts[0]),
    onReach: function(i){
      const sp = route.spots[i];
      curMarkers.push(pinIcon(pts[i][0],pts[i][1],sp.icon,(i+1)+'. '+sp.name,route.color,labelFor(sp.name)));
    }
  });
}

function openPreview(dayIdx){
  var d = DAYS[dayIdx];
  if(!d || d.monday) return;

  document.getElementById('pv-title').textContent = d.title + ' 이동 동선';
  document.getElementById('pv-sub').textContent = '전체 ' + d.items.length + '개 일정 · 탭하면 지도 이동';

  var scroll = document.getElementById('preview-scroll');
  scroll.innerHTML = '';
  if(d.items.some(it=>it.map_pin_usage==='reference_only')){
    var referenceNotice=document.createElement('div');referenceNotice.className='swarn';
    referenceNotice.textContent='미확정 위치가 포함된 참고 경로입니다. 실제 목적지와 집결지는 확정 안내를 확인하세요.';
    scroll.appendChild(referenceNotice);
  }

  // 전체 동선 한번에 그리기 버튼
  var drawBtn = document.createElement('button');
  drawBtn.className = 'pv-draw-all';
  drawBtn.innerHTML = '🗺️ 오늘 전체 동선 지도에 그리기';
  drawBtn.addEventListener('click', function(){ drawDayRoute(dayIdx); });
  scroll.appendChild(drawBtn);

  // 구글맵 멀티스톱 버튼
  var gmBtn = document.createElement('button');
  gmBtn.className = 'pv-gmaps';
  gmBtn.innerHTML = '🔵 구글맵에서 전체 경로 열기';
  gmBtn.addEventListener('click', function(){ openGmapsDay(dayIdx); });
  scroll.appendChild(gmBtn);

  // 타임라인
  var tl = document.createElement('div');
  tl.className = 'pv-tl';

  d.items.forEach(function(it, idx){
    // 위치 있는 항목만
    var row = document.createElement('div');
    row.className = 'pv-row';

    // 시간
    var timeEl = document.createElement('div');
    timeEl.className = 'pv-time';
    timeEl.textContent = it.time;
    row.appendChild(timeEl);

    // 도트+수직선
    var col = document.createElement('div');
    col.className = 'pv-col';
    var dot = document.createElement('div');
    dot.className = 'pv-dot';
      dot.style.background = DOT_COLOR[it.type] || '#aaa';
    var vline = document.createElement('div');
    vline.className = 'pv-vline';
    col.appendChild(dot); col.appendChild(vline);
    row.appendChild(col);

    // 카드
    var card = document.createElement('div');
    card.className = 'pv-card';
    var cname = document.createElement('div'); cname.className = 'pv-cname';
    cname.textContent = it.icon + ' ' + it.title;
    var cloc = document.createElement('div'); cloc.className = 'pv-cloc';
    cloc.textContent = '📍 ' + it.loc;
    card.appendChild(cname); card.appendChild(cloc);
    // 교통수단 세그먼트 배지 (trKey 있는 경우)
    if(it.trKey){
      var trs = TR[it.trKey];
      if(trs && trs.length){
        var seg = document.createElement('div');
        seg.className = 'pv-seg';
        var sline = document.createElement('div'); sline.className = 'pv-seg-line';
        var sbadge = document.createElement('div'); sbadge.className = 'pv-seg-badge';
        sbadge.style.background = trs[0].bc;
        sbadge.textContent = trs[0].name;
        seg.appendChild(sline); seg.appendChild(sbadge); seg.appendChild(sline.cloneNode());
        card.appendChild(seg);
      }
    }
    (function(item){ card.addEventListener('click', function(){
      closePreview();
      setTimeout(function(){ flyTo(item.lat, item.lng, item.zoom||15); }, 200);
    }); })(it);
    row.appendChild(card);
    tl.appendChild(row);
  });
  scroll.appendChild(tl);
  document.getElementById('preview-panel').classList.add('show');
  document.body.classList.add('panel-open');
}

function drawDayRoute(dayIdx){
  var d = DAYS[dayIdx];
  if(!d) return;
  if(!mapReady||typeof L==='undefined'||!map){ closePreview(); return; }
  // 위치 있는 아이템 추출
  var pts = d.items.filter(function(it){ return it.lat && it.lng; });
  if(pts.length < 2){ closePreview(); return; }

  // 이전 경로 → 흐리게
  cancelRouteAnim();
  if(curLine){
    pushPastLine(curLine.getLatLngs());
    map.removeLayer(curLine); curLine=null;
  }
  curMarkers.forEach(function(m){map.removeLayer(m);}); curMarkers=[];

  var latlngs = pts.map(function(it){return [it.lat, it.lng];});
  var color = d.bc || '#ff6b35';

  curLine = L.polyline([latlngs[0]], {
    color: color, weight:4, opacity:0.85,
    lineCap:'round', lineJoin:'round'
  }).addTo(map);


  // i번째 지점에 도달할 때마다 마커 + 직전 구간 화살표를 얹는다
  function placeAt(i){
    var it = pts[i];
    var c = DOT_COLOR[it.type]||'#888';
    if(i > 0){
      var mid = [(latlngs[i-1][0]+latlngs[i][0])/2, (latlngs[i-1][1]+latlngs[i][1])/2];
      var aic = L.divIcon({className:'',
        html:'<div style="font-size:12px;color:'+color+';filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))">➤</div>',
        iconAnchor:[6,8]});
      curMarkers.push(L.marker(mid,{icon:aic,interactive:false}).addTo(map));
    }
    var ic=L.divIcon({className:'',
      html:pinHTML(it.icon, c, it.map_pin_usage==='reference_only'?['참고 위치 · 미확정','Reference only']:labelFor(it.title)),
      iconSize:[28,28],iconAnchor:[14,14]});
    curMarkers.push(L.marker([it.lat,it.lng],{icon:ic}).addTo(map)
      .bindPopup('<b style="font-size:11px">'+it.time+' '+it.title+'</b>'+(it.map_pin_usage==='reference_only'?'<br>참고 위치 · 실제 목적지 확인 필요':'')));
  }

  animatePath(curLine, latlngs, {
    perSeg: 1900, maxMs: 15000,
    follow: true, maxZoom: 15, flyDur: 1.9, dwell: 300,
    head: makeHead(color, latlngs[0]),
    onReach: placeAt
  });

  closePreview();
}

function openGmapsDay(dayIdx){
  var d = DAYS[dayIdx];
  if(!d) return;
  if((d.items||[]).some(it=>/ICN→SIN|SIN→ICN/.test(it.title))){alert('항공 이동이 포함된 날은 전체 자동차 길찾기를 제공하지 않습니다. 각 공항 교통편의 길찾기를 이용하세요.');return;}
  if((d.items||[]).some(it=>it.map_pin_usage==='reference_only')){ alert('미확정 목적지가 포함되어 전체 길찾기를 열지 않습니다. 참관단 확정 안내를 확인하세요.'); return; }
  var pts = d.items.filter(function(it){ return it.lat && it.lng; });
  if(pts.length < 2) return;
  // 구글맵 멀티스톱: origin/destination + waypoints
  var origin = pts[0].lat+','+pts[0].lng;
  var dest = pts[pts.length-1].lat+','+pts[pts.length-1].lng;
  var waypts = pts.slice(1,-1).map(function(p){return p.lat+','+p.lng;}).join('|');
  var url = 'https://www.google.com/maps/dir/?api=1'
    +'&origin='+origin
    +'&destination='+dest
    +(waypts?'&waypoints='+encodeURIComponent(waypts):'')
    +'&travelmode=driving';
  window.open(url,'_blank');
  closePreview();
}

  lines.push(FieldAssistant.FLIGHT_NOTE);
  lines.push('e-Ticket 확인 항공 데이터: '+JSON.stringify(AIR_TRIP));
  lines.push('당일 일정:');
  (d.items||[]).forEach(function(it,i){
    var line = (i+1)+'. ['+it.time+'] '+it.title+' @ '+it.loc;
    if(it.warn) line += ' ⚠️'+it.warn;
    lines.push(line);
    if(it.secs) it.secs.forEach(function(s){ lines.push('   '+s.t+': '+s.b.replace(/<[^>]+>/g,'')); });
  });
  return lines.join('\n');
}

// 내장 시나리오 즉시 표시
function showBuiltinScenario(dayIdx, delay){
  setTimeout(function(){
    var data = SCENARIOS[dayIdx];
    var ld = document.getElementById('sim-loading');
    if(ld) ld.style.display = 'none';
    if(data) renderSimResult(data, dayIdx, false);
    else renderSimFallback(dayIdx);
  }, delay || 0);
}

// 하이브리드: 웹 배포 시 Claude API 실시간 생성, 파일/오프라인 시 내장 시나리오
function runSimulation(dayIdx){
  var isWeb = location.protocol === 'http:' || location.protocol === 'https:';
  if(!isWeb || !navigator.onLine){
    showBuiltinScenario(dayIdx, 600);
    return;
  }

  var lt = document.getElementById('sim-loading-text');
  if(lt) lt.textContent = 'Claude가 시나리오를 생성 중...';

  var done = false;
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  // 12초 내 응답 없으면 내장 시나리오로 전환
  var timer = setTimeout(function(){
    if(done) return;
    done = true;
    if(ctrl) try{ ctrl.abort(); }catch(e){}
    showBuiltinScenario(dayIdx, 0);
  }, 12000);

  fetch('/api/claude', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ dayIdx: dayIdx, context: buildDayContext(dayIdx) }),
    signal: ctrl ? ctrl.signal : undefined
  })
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(result){
    if(done) return;
    done = true; clearTimeout(timer);
    var ld = document.getElementById('sim-loading');
    if(ld) ld.style.display = 'none';
    if(result && result.scenarios && result.scenarios.length) renderSimResult(result, dayIdx, true);
    else showBuiltinScenario(dayIdx, 0);
  })
  .catch(function(){
    if(done) return;
    done = true; clearTimeout(timer);
    showBuiltinScenario(dayIdx, 0);
  });
}

function renderSimResult(result, dayIdx, isLive){
  var d = DAYS[dayIdx];
  var content = document.getElementById('sim-content');
  // Simulation dialogs are hypothetical; conflicts remain visible for built-in and live responses.
  var notice=document.createElement('div');notice.className='swarn';
  notice.textContent='예상 상황 연습용이며 확정 일정 안내가 아닙니다. '+(dayIdx===3?FieldAssistant.KDCEA:FieldAssistant.FLIGHT_NOTE);
  content.replaceChildren(notice);

  // 시나리오 출처 표시
  var src = document.createElement('div');
  src.className = 'sim-source';
  src.textContent = isLive ? '⚡ Claude 실시간 생성' : '📦 내장 시나리오 (오프라인 이용 가능)';
  content.appendChild(src);

  // 재생성 버튼
  if(location.protocol === 'http:' || location.protocol === 'https:'){
    var reBtn = document.createElement('button');
    reBtn.className = 'sim-btn';
    reBtn.innerHTML = '🔄 시나리오 다시 생성';
    reBtn.addEventListener('click', function(){
      document.getElementById('sim-content').innerHTML = '';
      document.getElementById('sim-loading').style.display = 'block';
      runSimulation(dayIdx);
    });
    content.appendChild(reBtn);
  }

  (result.scenarios || []).forEach(function(sc, idx){
    var card = document.createElement('div');
    card.className = 'sim-card';

    // 헤더
    var head = document.createElement('div'); head.className = 'sim-card-head';
    var icon = document.createElement('div'); icon.className = 'sim-card-icon'; icon.textContent = sc.icon||'💬';
    var title = document.createElement('div'); title.className = 'sim-card-title'; title.textContent = sc.title||'';
    var badge = document.createElement('div'); badge.className = 'sim-card-badge';
    badge.textContent = sc.badge||''; badge.style.background = sc.badgeColor||'#555'; badge.style.color='#fff';
    var arr = document.createElement('div'); arr.className = 'sim-card-arr'; arr.textContent = '▶';
    head.appendChild(icon); head.appendChild(title); head.appendChild(badge); head.appendChild(arr);

    // 바디
    var body = document.createElement('div'); body.className = 'sim-card-body';

    // 대화
    if(sc.dialogs && sc.dialogs.length){
      var dlg = document.createElement('div'); dlg.className = 'sim-dialog';
      sc.dialogs.forEach(function(dl){
        var bub = document.createElement('div');
        bub.className = 'sim-bubble ' + (dl.side||'left');
        var who = document.createElement('div'); who.className = 'sim-bubble-who'; who.textContent = dl.who||'';
        var txt = document.createElement('div'); txt.textContent = dl.text||'';
        bub.appendChild(who); bub.appendChild(txt);
        dlg.appendChild(bub);
      });
      body.appendChild(dlg);
    }
    // 팁
    if(sc.tip){
      var tipEl = document.createElement('div'); tipEl.className = 'sim-tip';
      var tipLbl = document.createElement('div'); tipLbl.className = 'sim-tip-lbl'; tipLbl.textContent = '💡 실전 팁';
      var tipTxt = document.createElement('div'); tipTxt.className = 'sim-tip-body'; tipTxt.textContent = sc.tip;
      tipEl.appendChild(tipLbl); tipEl.appendChild(tipTxt);
      body.appendChild(tipEl);
    }
    // 경고
    if(sc.warn){
      var warnEl = document.createElement('div'); warnEl.className = 'sim-warn';
      var warnLbl = document.createElement('div'); warnLbl.className = 'sim-warn-lbl'; warnLbl.textContent = '⚠️ 주의';
      var warnTxt = document.createElement('div'); warnTxt.className = 'sim-warn-body'; warnTxt.textContent = sc.warn;
      warnEl.appendChild(warnLbl); warnEl.appendChild(warnTxt);
      body.appendChild(warnEl);
    }

    card.appendChild(head); card.appendChild(body);
    // 토글
    head.addEventListener('click', function(){
      card.classList.toggle('open');
      arr.style.transform = card.classList.contains('open') ? 'rotate(90deg)' : '';
    });
    // 첫 번째 카드 자동 오픈
    if(idx === 0){ card.classList.add('open'); arr.style.transform = 'rotate(90deg)'; }
    content.appendChild(card);
  });
}

function renderFood(ci){
  var hero = mk('div','fd-hero');
  hero.innerHTML = '<div class="fd-hero-t">맛집 · 자투리 시간</div>'
    + '<div class="fd-hero-s">호텔과 행사장 근처, 그리고 1~2시간 뜰 때 갈 만한 곳입니다. '
    + '카드를 누르면 주소·영업시간·현장 팁이 나옵니다.</div>';
  ci.appendChild(hero);

  FOOD.forEach(function(cat){
    var wrap = mk('div','fd-cat');
    var h = mk('div','fd-cat-h');
    h.innerHTML = '<div class="fd-cat-i">' + cat.icon + '</div>'
      + '<div class="fd-cat-n">' + cat.cat + '</div>';
    wrap.appendChild(h);
    if(cat.note){
      var nt = mk('div','fd-cat-note');
      nt.textContent = cat.note;
      wrap.appendChild(nt);
    }

    cat.items.forEach(function(it){
      var card = mk('div','fd-item');
      var head = mk('div','fd-head');
      var tags = '';
      if(it.walk)  tags += '<span class="fd-tag walk">🚶 ' + it.walk + '</span>';
      if(it.open)  tags += '<span class="fd-tag open">🕐 ' + it.open + '</span>';
      if(it.price) tags += '<span class="fd-tag price">💰 ' + it.price + '</span>';
      head.innerHTML = '<div class="fd-top">'
        + '<span class="fd-n">' + it.n + '</span>'
        + (it.en ? '<span class="fd-en">' + it.en + '</span>' : '')
        + '<span class="fd-arr">▶</span></div>'
        + (tags ? '<div class="fd-meta">' + tags + '</div>' : '');
      card.appendChild(head);

      var body = mk('div','fd-body');
      var inner = '';
      if(it.addr) inner += '<div class="fd-addr">📍 ' + it.addr + '</div>';
      inner += '<div class="fd-d">' + it.d + '</div>';
      if(it.tip) inner += '<div class="fd-tip"><div class="fd-tip-l">💡 현장 팁</div>'
        + '<div class="fd-tip-b">' + it.tip + '</div></div>';
      body.innerHTML = inner;

      // 좌표가 있는 곳만 지도 버튼
      if(it.lat && it.lng){
        var btns = mk('div','fd-btns');
        var b1 = document.createElement('button');
        b1.className = 'fd-btn fd-btn-map';
        b1.textContent = '🗺️ 지도에서 보기';
        (function(la,ln,nm){ b1.addEventListener('click', function(){
          setFoodMarker(la, ln, nm);
        }); })(it.lat, it.lng, it.n);
        var b2 = document.createElement('button');
        b2.className = 'fd-btn fd-btn-nav';
        b2.textContent = '🔵 길찾기';
        (function(la,ln,q){ b2.addEventListener('click', function(){
          window.open('https://www.google.com/maps/dir/?api=1&destination='
            + la + ',' + ln + '&travelmode=walking', '_blank');
        }); })(it.lat, it.lng, it.en || it.n);
        btns.appendChild(b1); btns.appendChild(b2);
        body.appendChild(btns);
      }

      card.appendChild(body);
      head.addEventListener('click', function(){
        var wasOpen = card.classList.contains('open');
        card.classList.toggle('open');
        if(!wasOpen && it.lat && it.lng) setFoodMarker(it.lat, it.lng, it.n);
      });
      wrap.appendChild(card);
    });
    ci.appendChild(wrap);
  });
}

// 맛집 위치를 지도에 표시
function setFoodMarker(lat, lng, name){
  if(!mapReady || typeof L === 'undefined' || !map) return;
  curMarkers.forEach(function(m){ map.removeLayer(m); });
  curMarkers = [];
  var mk_ = pinIcon(lat, lng, '🍜', name, '#c45e0a');
  if(mk_) curMarkers.push(mk_);
  map.flyTo([lat, lng], 16, { animate:true, duration:0.7 });
}

var CK_KEY = 'sg_checklist_v1';
var ckState = {};
var ckOpenGroups = {};

function ckLoad(){
  try { ckState = JSON.parse(localStorage.getItem(CK_KEY) || '{}') || {}; }
  catch(e) { ckState = {}; }   // 저장이 막힌 환경에서도 세션 내에서는 동작
}
function ckSave(){
  try { localStorage.setItem(CK_KEY, JSON.stringify(ckState)); } catch(e) {}
}
function ckTotals(){
  var total = 0, done = 0;
  CHECKLIST.forEach(function(g){
    g.items.forEach(function(it){ total++; if(ckState[it.id]) done++; });
  });
  return { total: total, done: done };
}
function ckGroupTotals(g){
  var done = 0;
  g.items.forEach(function(it){ if(ckState[it.id]) done++; });
  return { total: g.items.length, done: done };
}

var studyData = null;

function studyDecode(pin){
  try{
    var bin = atob(STUDY_ENC);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var k = new TextEncoder().encode(pin);
    var out = new Uint8Array(bytes.length);
    for(var j=0;j<bytes.length;j++) out[j] = bytes[j] ^ k[j % k.length];
    var txt = new TextDecoder('utf-8').decode(out);
    if(txt.slice(0,6) !== '@@SG@@') return null;
    return JSON.parse(txt.slice(6));
  }catch(e){ return null; }
}

function stQLoad(){
  try{ return JSON.parse(localStorage.getItem('sg_study_q')||'{}'); }catch(e){ return {}; }
}
function stQSave(o){ try{ localStorage.setItem('sg_study_q', JSON.stringify(o)); }catch(e){} }

function renderStudy(ci){
  if(!studyData){
    try{ if(sessionStorage.getItem('sg_study_ok')==='1') studyData = studyDecode('0927'); }catch(e){}
  }
  if(!studyData){ renderStudyLock(ci); return; }
  renderStudyBody(ci);
}

function renderStudyLock(ci){
  var w = mk('div','st-lock');
  w.innerHTML = '<div class="st-lock-i">🔒</div>'
    + '<div class="st-lock-t">출장 학습노트</div>'
    + '<div class="st-lock-s">AI 서버 냉각·전력과 건축계획<br>본인 확인용 PIN을 입력하세요</div>';
  var row = mk('div','st-pin');
  var inp = document.createElement('input');
  inp.type='tel'; inp.inputMode='numeric'; inp.maxLength=8; inp.placeholder='••••';
  var btn = document.createElement('button'); btn.textContent='열기';
  row.appendChild(inp); row.appendChild(btn);
  w.appendChild(row);
  var err = mk('div','st-err'); w.appendChild(err);
  ci.appendChild(w);

  function tryOpen(){
    var d = studyDecode(inp.value.trim());
    if(d){
      studyData = d;
      try{ sessionStorage.setItem('sg_study_ok','1'); }catch(e){}
      ci.innerHTML=''; renderStudyBody(ci);
    } else {
      err.textContent = 'PIN이 맞지 않습니다';
      inp.value=''; inp.focus();
    }
  }
  btn.addEventListener('click', tryOpen);
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryOpen(); });
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 120);
}

function renderStudyBody(ci){
  var done = stQLoad();
  studyData.sections.forEach(function(sec){
    var card = mk('div','st-sec');
    var h = mk('div','st-h');
    h.style.background = sec.c;
    h.innerHTML = '<span class="st-h-i">'+sec.icon+'</span><span class="st-h-t">'+sec.h+'</span>';
    card.appendChild(h);
    var body = mk('div','st-body');
    sec.blocks.forEach(function(bl){
      if(bl.t==='lead'){ var e=mk('div','st-lead'); e.innerHTML=bl.b; body.appendChild(e); }
      else if(bl.t==='text'){ var e2=mk('div','st-text'); e2.innerHTML=bl.b; body.appendChild(e2); }
      else if(bl.t==='note'){ var e3=mk('div','st-note'); e3.innerHTML=bl.b; body.appendChild(e3); }
      else if(bl.t==='num'){
        var n=mk('div','st-num');
        n.innerHTML='<div class="st-num-n">'+bl.n+'</div><div><div class="st-num-h">'
          +bl.h+'</div><div class="st-num-b">'+bl.b+'</div></div>';
        body.appendChild(n);
      }
      else if(bl.t==='table'){
        var tb=document.createElement('table'); tb.className='st-tbl';
        bl.rows.forEach(function(r){
          var tr=document.createElement('tr');
          r.forEach(function(cell){ var td=document.createElement('td'); td.innerHTML=cell; tr.appendChild(td); });
          tb.appendChild(tr);
        });
        body.appendChild(tb);
      }
      else if(bl.t==='bullets'){
        var ul=document.createElement('ul'); ul.className='st-ul';
        bl.items.forEach(function(it){ var li=document.createElement('li'); li.innerHTML=it; ul.appendChild(li); });
        body.appendChild(ul);
      }
      else if(bl.t==='q'){
        var q=mk('div','st-q'+(done[bl.id]?' on':''));
        q.innerHTML='<div class="st-q-box">✓</div><div class="st-q-t">'+bl.b+'</div>';
        q.addEventListener('click', function(){
          var st=stQLoad();
          if(st[bl.id]){ delete st[bl.id]; q.classList.remove('on'); }
          else { st[bl.id]=1; q.classList.add('on'); }
          stQSave(st);
        });
        body.appendChild(q);
      }
    });
    card.appendChild(body);
    ci.appendChild(card);
  });
  var rb = mk('button','st-reset');
  rb.textContent='질문 체크 초기화 · 잠그기';
  rb.addEventListener('click', function(){
    stQSave({}); studyData=null;

function renderChecklist(ci){
  ckLoad();

  // 상단 진행률
  var t = ckTotals();
  var pct = t.total ? Math.round(t.done / t.total * 100) : 0;
  var hero = mk('div','ck-hero');
  hero.innerHTML =
      '<div class="ck-hero-t">출발 전 준비 체크리스트</div>'
    + '<div class="ck-hero-s">9/27 출발까지 준비할 것들입니다. 체크는 이 기기에 저장되니 나눠서 하셔도 됩니다.</div>'
    + '<div class="ck-bar-wrap"><div class="ck-bar" id="ckBar"></div></div>'
    + '<div class="ck-bar-lbl">'
    +   '<span><span class="ck-bar-n" id="ckDone">' + t.done + '</span> / ' + t.total + ' 완료</span>'
    +   '<button class="ck-reset" id="ckReset">전체 해제</button>'
    + '</div>';
  ci.appendChild(hero);
  setTimeout(function(){
    var bar = document.getElementById('ckBar');
    if(bar) bar.style.width = pct + '%';
  }, 60);
  document.getElementById('ckReset').addEventListener('click', function(){
    ckState = {}; ckSave();
    renderDay(curDay);
  });

  // 그룹
  CHECKLIST.forEach(function(g, gi){
    var gt = ckGroupTotals(g);
    var allDone = gt.done === gt.total;
    // 기본 펼침: 첫 미완료 그룹
    if (ckOpenGroups[gi] === undefined) ckOpenGroups[gi] = !allDone && !CHECKLIST.slice(0, gi).some(function(pg, pi){
      var p = ckGroupTotals(pg); return p.done < p.total && ckOpenGroups[pi] !== false;
    });

    var box = mk('div','ck-group' + (ckOpenGroups[gi] ? ' open' : ''));
    var head = mk('div','ck-ghead');
    head.innerHTML =
        '<div class="ck-gicon">' + g.icon + '</div>'
      + '<div class="ck-gname">' + g.group + '</div>'
      + '<div class="ck-gcount' + (allDone ? ' done' : '') + '">' + gt.done + '/' + gt.total + '</div>'
      + '<div class="ck-garr">▶</div>';
    head.addEventListener('click', function(){
      ckOpenGroups[gi] = !box.classList.contains('open');
      box.classList.toggle('open');
    });
    box.appendChild(head);

    var body = mk('div','ck-body');
    g.items.forEach(function(it){
      var row = mk('div','ck-item' + (ckState[it.id] ? ' on' : ''));
      row.innerHTML =
          '<div class="ck-box">✓</div>'
        + '<div class="ck-txt">'
        +   '<div class="ck-t">' + it.t + (it.critical ? '<span class="ck-req">필수</span>' : '') + '</div>'
        +   '<div class="ck-d">' + it.d + '</div>'
        + '</div>';
      row.addEventListener('click', function(){
        ckState[it.id] = !ckState[it.id];
        if(!ckState[it.id]) delete ckState[it.id];
        ckSave();
        row.classList.toggle('on', !!ckState[it.id]);
        ckRefreshCounts();
      });
      body.appendChild(row);
    });
    box.appendChild(body);
    ci.appendChild(box);
  });

  var note = mk('div','ck-note');
  note.textContent = '체크 상태는 이 기기에만 저장됩니다. 팀원은 각자 체크하세요.';
  ci.appendChild(note);
}

// 체크할 때마다 전체를 다시 그리지 않고 숫자만 갱신
function ckRefreshCounts(){
  var t = ckTotals();
  var bar = document.getElementById('ckBar');
  var dn = document.getElementById('ckDone');
  if(bar) bar.style.width = (t.total ? Math.round(t.done / t.total * 100) : 0) + '%';
  if(dn) dn.textContent = t.done;
  document.querySelectorAll('.ck-group').forEach(function(box, gi){
    var g = CHECKLIST[gi]; if(!g) return;
    var gt = ckGroupTotals(g);
    var c = box.querySelector('.ck-gcount');
    if(c){ c.textContent = gt.done + '/' + gt.total;
           c.classList.toggle('done', gt.done === gt.total); }
  });
}

function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}

// ── 딥링크 네비게이션 ─────────────────────────────────────────
// 교통수단 모드 → 구글맵 travelmode 매핑
const GM_MODE = {driving:'driving', transit:'transit', walking:'walking'};

function openGoogleNav(trKey, trId){
  if(['bus_mbs_jb','bus_jb_hotel'].includes(trKey)){ alert('목적지 확인 전에는 길찾기를 제공하지 않습니다. 참관단 확정 안내를 확인하세요.'); return; }
  const trs = TR[trKey];
  if(!trs) return;
  const tr = trs.find(t=>t.id===trId);
  if(!tr) return;
  const from = tr.from; // [lat,lng]
  const to   = tr.to;
  const mode = GM_MODE[tr.mode] || 'driving';

  // 구글맵 딥링크 — 앱 설치 시 앱 열림, 미설치 시 웹 열림
  // 형식: https://www.google.com/maps/dir/?api=1&origin=lat,lng&destination=lat,lng&travelmode=MODE
  const url = `https://www.google.com/maps/dir/?api=1`
    + (from ? `&origin=${from[0]},${from[1]}` : '')
    + `&destination=${encodeURIComponent(tr.destination_query || (to[0]+','+to[1]))}`
    + `&travelmode=${mode}`;
  window.open(url, '_blank');
}

function openGrab(trKey){
  if(['bus_mbs_jb','bus_jb_hotel'].includes(trKey)){ alert('목적지 확인 전에는 차량 호출을 연결하지 않습니다. 확정 안내를 확인하세요.'); return; }
  const trs = TR[trKey];
  if(!trs) return;
  const tr = trs.find(t=>t.id==='grab');
  if(!tr) return;
  const to = tr.to;
  if(!to){alert('귀국 목적지는 항공권에서 확인된 Changi Airport Terminal 2입니다. 정확한 하차 좌표는 등록되어 있지 않으므로 Grab 앱에서 T2 출국장을 직접 선택하세요.');return;}

  // Grab 딥링크 — 목적지 좌표로 앱 열기
  // grab:// 스킴: 앱 설치 시 앱 열림
  // 폴백: Grab 웹 (모바일 브라우저)
  const grabDeep = `grab://open?screenType=BOOKING&dropoffLatitude=${to[0]}&dropoffLongitude=${to[1]}`;
  const grabWeb  = `https://grab.onelink.me/2695613898?af_dp=${encodeURIComponent(grabDeep)}&af_web_dp=https://www.grab.com/sg/`;

  // 앱 딥링크 시도 → 300ms 후 미설치면 앱스토어/웹으로
  const iframe = document.createElement('iframe');
  iframe.style.display='none';
  iframe.src = grabDeep;
  document.body.appendChild(iframe);
  setTimeout(()=>{
    document.body.removeChild(iframe);
    // 앱 전환 안 됐으면 웹으로
    window.open(grabWeb,'_blank');
  }, 1500);
}

        it.warn=(it.warn?it.warn+'<br>':'')+'미확정 목적지 · 지도 PIN/경로는 참고용 · 전용버스 단체 이동';
      }
      if(/장소.{0,10}협의|장소 미정/.test((it.loc||'')+' '+(it.secs||[]).map(s=>clean(s.b)).join(' '))){
        it.verification_status='unverified';it.map_pin_usage='reference_only';it.verification_note='행사 장소 미확정 · 기존 지도 PIN은 참고용입니다. 주최 측 확정 안내 확인 필요.';
        it.warn=(it.warn?it.warn+'<br>':'')+it.verification_note;
      }
    }));
    ['bus_mbs_jb','bus_jb_hotel'].forEach(key=>TR[key].forEach(tr=>{tr.verification_status='unverified';tr.map_pin_usage='reference_only';tr.body=KDCEA+'\n참고 경로: '+tr.body;}));
  }
  function applyVerifiedFlights(){
    DAYS.forEach(d=>(d.items||[]).forEach(it=>{
      const date=dateOf(d);
      if(date==='2026-09-27'&&/ICN→SIN|창이공항 도착/.test(it.title)){
        it.flight_leg='outbound';it.flight_event=/ICN→SIN/.test(it.title)?'departure':'arrival';
        it.terminal=it.flight_event==='departure'?'1':null;
        it.map_pin_usage='reference_only';it.verification_status='unverified';
        it.verification_note='도착 터미널은 e-Ticket 공란입니다. 기존 지도 좌표는 공항 참고 위치이며 실제 도착 터미널/픽업존을 뜻하지 않습니다.';
        it.warn=it.verification_note;
      }
      if(date==='2026-10-02'&&/창이|SIN→ICN/.test(it.title)){
        it.terminal='2';it.destination_query='Singapore Changi Airport Terminal 2 Departure Hall';
        // Existing coordinates were for T3. The ticket verifies a terminal name, not coordinates.
        if(!/호텔 출발/.test(it.title)){it.lat=null;it.lng=null;}
      }
      if(date==='2026-10-02'&&/SIN→ICN|인천공항 T1 도착/.test(it.title)){
        it.flight_leg='inbound';it.flight_event=/SIN→ICN/.test(it.title)?'departure':'arrival';it.terminal=it.flight_event==='departure'?'2':'1';
      }
    }));
    TR.d4_airport.forEach(tr=>{tr.to=null;tr.destination_query='Singapore Changi Airport Terminal 2 Departure Hall';tr.destination_metadata={...AIR_TRIP.metadata};});
    TR.d0_arrive.forEach(tr=>{tr.from=null;tr.origin_metadata=AIR_TRIP.outbound.arrival_terminal_metadata;tr.body='도착 터미널 미기재 · 픽업/승차 위치는 현장 확인.\n'+tr.body;});
  }
  function add(tag,parent,text,cls){const el=document.createElement(tag);if(text)el.textContent=text;if(cls)el.className=cls;if(parent)parent.appendChild(el);return el;}
  function button(parent,text,fn){const el=add('button',parent,text);el.type='button';el.onclick=fn;return el;}
  function speak(text){
    if(!('speechSynthesis' in window))return;
    window.speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='ko-KR';window.speechSynthesis.speak(utter);
  }
  function result(text){const out=document.getElementById('fa-answer');out.textContent=text;if(document.getElementById('fa-read').checked)speak(text);}
  async function ask(){
    if(busy)return;
    const input=document.getElementById('fa-question'),q=input.value.trim();if(!q)return;
    busy=true;document.getElementById('fa-send').disabled=true;
    try{
      const s=lastTarget||target(),local=answer(q,new Date(),s);
      if(local){result(local);return;}
      if(!navigator.onLine||!/^https?:$/.test(location.protocol)){result('오프라인 일정 조회: 질문을 이해하지 못했습니다. “다음 일정 어디야”, “누구 만나”, “여기서 뭘 봐야 해” 또는 항공편 질문을 이용하세요.');return;}
      result('등록된 출장 자료에서 답변을 찾고 있습니다…');
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
      try{
        const response=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({mode:'assistant',question:q,context:JSON.stringify({now:new Date().toISOString(),flights:AIR_TRIP,selected:s,selected_day:s?listFor(s.WHEN.date):[],constraints:[KDCEA,FLIGHT_NOTE]})})});
        if(!response.ok)throw new Error('unavailable');const data=await response.json();
        if(typeof data.answer!=='string'||!data.answer.trim())throw new Error('empty');
        result('AI 답변 · 기존 자료 기반, 확정 안내와 대조하세요.\n'+data.answer+'\n\n미확정 안내: '+(s?.WHERE.map_pin_usage==='reference_only'?s.metadata.note:'등록되지 않은 정보는 확정할 수 없습니다.'));
      }catch(e){result('AI 연결이 원활하지 않습니다. 일정 조회와 체크리스트는 계속 사용할 수 있습니다. “다음 일정 어디야”, “오늘 일정 알려줘”, “KDCEA 어디로 가?”로 질문하세요.');}finally{clearTimeout(timer);}
    }finally{busy=false;document.getElementById('fa-send').disabled=false;}
  }
  function listFor(date){return schedules().filter(s=>s.WHEN.date===date);}
  function refresh(){
    const state=timeline(),s=target();
    document.getElementById('fa-now').textContent='NOW · '+(state.current?summary(state.current)+' (시작 시각 기준 · 진행 여부 확인 필요)':'현재 시작된 당일 일정 없음');
    document.getElementById('fa-next').textContent='NEXT · '+summary(state.next);
    const details=document.getElementById('fa-context');details.textContent=s?summary(s)+'\nWHERE · '+(s.WHERE.map_pin_usage==='reference_only'?s.metadata.note:s.WHERE.place_name_ko)+'\nHOW · '+(s.HOW.transportation||'이동수단 확인 필요')+'\nLEAVE · '+(s.WHEN.departure_time||'출발 권장시각 미등록')+'\nDO · '+(s.ACTION.what_to_do||'도착 후 안내 확인 필요'):'선택 가능한 출장 일정이 없습니다.';
    loadNote();
  }
  function fillSelect(){const sel=document.getElementById('fa-schedule');sel.replaceChildren();let opt=add('option',sel,'현재 시간 기준');opt.value='';schedules().forEach(s=>{opt=add('option',sel,summary(s));opt.value=s.id;});sel.value=selectedId||'';}
  function loadNote(){const s=target(),box=document.getElementById('fa-note');try{box.value=s?localStorage.getItem('sg_field_note_'+s.id)||'':'';}catch(e){box.value='';}}
  function init(){
    const style=add('style',document.head);style.textContent=`
      #fa-launch{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));right:16px;z-index:1100;background:#173d53;color:white;border:0;border-radius:28px;padding:15px 22px;box-shadow:0 3px 14px #0004;font:600 15px sans-serif;min-height:48px}
      #fa-panel{border:0;border-radius:18px;padding:0;width:min(620px,calc(100vw - 20px));max-height:90dvh;color:#193344;background:#f6f8fa;box-shadow:0 8px 50px #0005;overflow:auto}#fa-panel::backdrop{background:#10233088}
      #fa-panel header{position:sticky;top:0;background:#173d53;color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:1}#fa-panel header button{background:transparent;color:white;border:1px solid #ffffff88}
      #fa-body{padding:16px;display:grid;gap:12px}#fa-panel button,#fa-panel input,#fa-panel select,#fa-panel textarea{font:inherit;min-height:44px;border-radius:8px;border:1px solid #c6d2da;padding:9px;max-width:100%;box-sizing:border-box}#fa-panel button{cursor:pointer;background:white;color:#173d53}#fa-panel button:disabled{opacity:.6}#fa-panel textarea{width:100%;min-height:85px}#fa-panel select{width:100%;background:white}#fa-panel input[type=text]{width:100%}#fa-panel input[type=checkbox]{min-height:20px;vertical-align:middle}
      .fa-row{display:flex;gap:8px;flex-wrap:wrap}.fa-card{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px;border-radius:10px;line-height:1.6}.fa-muted{font-size:12px;color:#586b76}#fa-answer{border-left:4px solid #218178;min-height:64px}#fa-context{max-height:200px;overflow:auto}#fa-panel summary{cursor:pointer;padding:8px 0}#ci{padding-bottom:85px!important}
    `;
    const launch=button(document.body,'AI에게 물어보기',open);launch.id='fa-launch';launch.setAttribute('aria-haspopup','dialog');
    const panel=add('dialog',document.body);panel.id='fa-panel';panel.setAttribute('aria-labelledby','fa-title');
    const header=add('header',panel);add('strong',header,'AI Field Assistant').id='fa-title';button(header,'닫기',()=>panel.close());
    panel.addEventListener('close',()=>{recognition?.abort();window.speechSynthesis?.cancel();launch.focus();});
    const body=add('div',panel);body.id='fa-body';
    add('div',body,'현지 시간 기준 · 싱가포르/조호르 UTC+8 · 한국 출도착 UTC+9','fa-muted');
    add('div',body,'','fa-card').id='fa-now';add('div',body,'','fa-card').id='fa-next';
    const label=add('label',body,'질문할 일정 (미리보기)');label.htmlFor='fa-schedule';
    const sel=add('select',body);sel.id='fa-schedule';sel.onchange=()=>{selectedId=sel.value||null;lastTarget=null;refresh();};
    add('div',body,'','fa-card').id='fa-context';
    const links=add('div',body,'','fa-row');
    button(links,'기존 일정 보기',()=>{const s=lastTarget||target();if(s){switchDay(s.dayIndex);panel.close();}});
    button(links,'현재 위치 → 목적지',()=>{
      const s=lastTarget||target();
      if(!s||s.WHERE.map_pin_usage==='reference_only'||(!s.WHERE.place_name_en&&(s.WHERE.latitude===null||s.WHERE.longitude===null))){result(s?.metadata.note||'목적지 위치가 등록되어 있지 않습니다.');return;}
      result('기존 앱에 등록된 위치로 Google Maps를 엽니다. 현재 위치와 이동수단은 지도에서 확인하세요.');
      window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.WHERE.place_name_en||s.WHERE.latitude+','+s.WHERE.longitude),'_blank','noopener,noreferrer');
    });
    button(links,'당일 경로',()=>{const s=lastTarget||target();if(s){panel.close();switchDay(s.dayIndex);if(!DAYS[s.dayIndex].monday)openPreview(s.dayIndex);}});
    button(links,'AI 당일 시나리오',()=>{const s=lastTarget||target();if(s){if(DAYS[s.dayIndex].monday){result('월요일은 자유 탐방입니다. 기존 일정에서 코스를 선택해 확인하세요.');return;}panel.close();openSim(s.dayIndex);}});
    const pl=add('label',body,'출장자 (좌석 질문용)');pl.htmlFor='fa-person';const ps=add('select',body);ps.id='fa-person';add('option',ps,'선택 안 함').value='';people.forEach(p=>add('option',ps,p.name).value=p.name);
    const quick=add('div',body,'','fa-row');['오늘 일정 알려줘','다음 일정 어디야','KDCEA 어디로 가?','여기서 뭘 봐야 해?'].forEach(q=>button(quick,q,()=>{document.getElementById('fa-question').value=q;ask();}));
    const form=add('form',body);const ql=add('label',form,'출장 일정 질문');ql.htmlFor='fa-question';const input=add('input',form);input.id='fa-question';input.type='text';input.maxLength=1000;input.placeholder='예: 내일 일정, 임상철 좌석';
    const row=add('div',form,'','fa-row');const send=button(row,'질문 보내기',ask);send.id='fa-send';
    form.onsubmit=e=>{e.preventDefault();ask();};
    const mic=button(row,'마이크',()=>{
      if(recognition){recognition.stop();return;}
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
      window.speechSynthesis?.cancel();recognition=new SR();recognition.lang='ko-KR';recognition.interimResults=false;
      recognition.onstart=()=>{mic.textContent='듣기 중 · 중지';};recognition.onend=()=>{recognition=null;mic.textContent='마이크';};
      recognition.onerror=e=>result(e.error==='not-allowed'?'마이크 권한을 허용하거나 텍스트로 질문하세요.':'음성 인식을 완료하지 못했습니다. 텍스트 입력을 이용하세요.');
      recognition.onresult=e=>{input.value=e.results[0][0].transcript;ask();};
      try{recognition.start();}catch(e){recognition=null;result('마이크를 시작하지 못했습니다. 텍스트 입력을 이용하세요.');}
    });
    if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){mic.disabled=true;mic.textContent='음성 입력 미지원';}
    const rl=add('label',body);const read=add('input',rl);read.type='checkbox';read.id='fa-read';rl.appendChild(document.createTextNode(' 답변 읽어주기'));read.disabled=!('speechSynthesis' in window);read.onchange=()=>{if(!read.checked)window.speechSynthesis?.cancel();};
    button(body,'음성 재생 중지',()=>window.speechSynthesis?.cancel());
    add('div',body,'음성 인식은 브라우저 제공 기능이며 기기·네트워크·권한에 따라 제한됩니다.','fa-muted');
    const out=add('div',body,'질문하거나 일정을 선택하세요. 오프라인에서도 주요 일정 질문에 답합니다.','fa-card');out.id='fa-answer';out.setAttribute('role','status');out.setAttribute('aria-live','polite');
    const notes=add('details',body);add('summary',notes,'현장 체크리스트 · 메모');button(notes,'선택 장소 체크리스트',()=>result(checklist(target())));
    const nl=add('label',notes,'선택 일정의 현장 메모');nl.htmlFor='fa-note';const note=add('textarea',notes);note.id='fa-note';note.maxLength=10000;
    button(notes,'이 기기에 메모 저장',()=>{const s=target();if(!s){result('메모를 저장할 일정을 선택하세요.');return;}try{localStorage.setItem('sg_field_note_'+s.id,note.value);result(s.title+'에 메모를 저장했습니다. 이 브라우저에만 저장됩니다.');}catch(e){result('저장 공간을 사용할 수 없습니다. 메모를 복사해 보관하세요.');}});
    add('div',notes,'메모는 이 브라우저에만 저장되며 AI 서버에 보내지 않습니다. 기기 간 동기화되지 않습니다.','fa-muted');
    fillSelect();refresh();setInterval(()=>{if(panel.open){const noteFocused=document.activeElement===note;if(!noteFocused){const saved=note.value;refresh();note.value=saved;}}},60000);
  }
  function overview(parent){
    const state=timeline(),card=add('div',parent,'','fa-card');card.id='fa-overview';
    card.style.cssText='margin:10px 0;background:#edf5f6;color:#193344;border:1px solid #d3e4e8';
    add('strong',card,'HAEAHN · AI Field Assistant');
    add('div',card,'NOW · '+(state.current?summary(state.current)+' (진행 여부 확인 필요)':'현재 시작된 당일 일정 없음'));
    add('div',card,'NEXT · '+summary(state.next));
    button(card,'이동·도착 안내 / AI에게 물어보기',open);
    add('div',card,FLIGHT_NOTE,'fa-muted');
  }
  function open(){fillSelect();refresh();document.getElementById('fa-panel').showModal();}
  applyVerifiedFlights();
  patchSafety();
  document.addEventListener('DOMContentLoaded',init);
  return {schedules,timeline,answer,normalize,dateOf,stamp,checks,people,flights:AIR_TRIP,KDCEA,FLIGHT_NOTE,overview};
})();

if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
