</script>
<style>
:root{--acc:#1a3a5c;--acc2:#c8a84b;--bg:#f5f2ed;--card:#fff;
  --text:#1a1a1a;--t2:#555;--t3:#999;--bdr:#e8e2d9;
  --grn:#1e7e5a;--org:#c45e0a;--blu:#1255a0;--red:#a82020;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0)}
/* HEADER */
#hdr{background:var(--acc);flex-shrink:0;z-index:200}
.ht{display:flex;align-items:center;justify-content:space-between;padding:9px 13px 5px}
.ht-t{font-size:13px;font-weight:700;color:#fff}
.ht-s{font-size:9px;color:rgba(255,255,255,.6);margin-top:1px}
.hbg{border-radius:20px;padding:3px 9px;font-size:10px;font-weight:700;color:#fff}
.dtabs{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.12)}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;padding:6px 11px;border:none;background:none;cursor:pointer;
  font-size:11px;font-weight:600;color:rgba(255,255,255,.5);
  border-bottom:2.5px solid transparent;white-space:nowrap;line-height:1.3;
  display:flex;flex-direction:column;align-items:center}
.dtab small{font-size:9px;opacity:.7;margin-top:1px}
.dtab.on{color:#fff;border-bottom-color:var(--acc2)}
.dtab-ck{position:relative}
.dtab-ck::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;
  border-radius:50%;background:var(--acc2)}
.dtab-ck.ck-clear::after{display:none}
/* MAP */
#mapWrap{flex-shrink:0;height:36%;position:relative;background:#e8e4dc;z-index:1;isolation:isolate}
#map{width:100%;height:100%}
body.panel-open .leaflet-control-container{pointer-events:none;opacity:.35}
#lgd{position:absolute;bottom:6px;left:6px;z-index:500;
  background:rgba(26,58,92,.82);border-radius:8px;padding:5px 9px;
  display:flex;gap:8px;backdrop-filter:blur(4px)}
.lg{display:flex;align-items:center;gap:3px;font-size:9px;color:#fff}
.lg-l{width:16px;height:3px;border-radius:2px}
.map-notice{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;background:#eceae4;padding:20px;text-align:center}
.mn-icon{font-size:30px;opacity:.35}
.mn-title{font-size:13px;font-weight:700;color:var(--t2)}
.mn-sub{font-size:11px;color:var(--t3);line-height:1.6;max-width:260px}
/* CONTENT */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ci{padding:12px 13px 50px}
/* DAY HERO */
.dhero{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dh-t{font-size:17px;font-weight:800;color:var(--acc)}
.dh-s{font-size:10px;color:var(--t3);margin-top:2px}
.dbg{border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;color:#fff}
/* STEP */
.step{background:var(--card);border-radius:13px;border:1px solid var(--bdr);margin-bottom:9px;overflow:hidden}
.step-h{display:flex;gap:9px;padding:11px 13px;cursor:pointer;align-items:flex-start}
.stime{font-size:10px;color:var(--t3);font-weight:600;min-width:36px;padding-top:3px;font-variant-numeric:tabular-nums}
.sdot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
.dt{background:var(--blu)}.de{background:var(--grn)}.dtr{background:var(--org)}.ds{background:var(--red)}.df{background:#aaa}
.smain{flex:1}
.si{font-size:17px;margin-bottom:2px}
.stt{font-size:13px;font-weight:700;color:var(--acc);line-height:1.3}
.sloc{font-size:11px;color:var(--t2);margin-top:2px}
.swarn{font-size:11px;color:var(--org);font-weight:700;margin-top:3px}
.schips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:10px;font-weight:600;padding:2px 6px;border-radius:10px}
.cb{background:#e3eef9;color:#1255a0}.cg{background:#e0f2ea;color:#1e7e5a}
.co{background:#fef0e3;color:#c45e0a}.cr{background:#fce8e8;color:#a82020}.ck{background:#f0ede8;color:#555}
/* DETAIL */
.sdet{display:none;padding:0 13px 13px;border-top:1px solid var(--bdr)}
.sdet.open{display:block}
.dsec{margin-top:10px}
.dslbl{font-size:9px;font-weight:800;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.dsbody{font-size:12px;color:var(--text);line-height:1.75}
/* TRANSPORT */
.tropts{display:flex;flex-direction:column;gap:6px;margin-top:5px}
.tropt{background:#f8f6f2;border-radius:9px;padding:9px 11px;
  border:1.5px solid var(--bdr);cursor:pointer;transition:all .15s}
.tropt.sel{border-color:var(--acc);background:#edf2fa}
.tropt:active{opacity:.8}
.trh{display:flex;align-items:center;gap:6px;margin-bottom:0}
.trbg{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;color:#fff}
.trn{font-size:12px;font-weight:700;color:var(--acc)}
.trarr{margin-left:auto;font-size:11px;color:var(--t3);transition:transform .2s}
.tropt.sel .trarr{transform:rotate(90deg);color:var(--acc)}
.trbody{font-size:11px;color:var(--t2);line-height:1.65;display:none;
  margin-top:7px;border-top:1px solid var(--bdr);padding-top:6px}
.tropt.sel .trbody{display:block}
.maprbtn{display:inline-flex;align-items:center;gap:4px;margin-top:7px;
  background:var(--acc);color:#fff;border:none;border-radius:8px;
  padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer}
.tipbox{background:linear-gradient(135deg,#fffbf0,#fff8e8);
  border:1.5px solid #e8c96e;border-radius:9px;padding:9px 11px;margin-top:8px}
.tiplbl{font-size:9px;font-weight:800;color:#9a7420;margin-bottom:3px}
.tipbody{font-size:12px;color:var(--text);line-height:1.7;white-space:pre-line}
.mapbtn{display:flex;align-items:center;justify-content:center;gap:5px;
  width:100%;margin-top:9px;padding:10px;border-radius:9px;border:none;
  background:var(--acc);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
/* 네비게이션 버튼 그룹 */
.nav-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.nbtn{flex:1;min-width:0;padding:8px 4px;border:none;border-radius:9px;
  font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.nbtn:active{opacity:.8}
.nbtn-map{background:var(--acc);color:#fff}
.nbtn-google{background:#4285f4;color:#fff}
.nbtn-grab{background:#00b14f;color:#fff}
/* AI 시뮬레이션 패널 */
#sim-panel{
  position:fixed;inset:0;z-index:2100;
  background:rgba(5,10,20,.8);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;
}
#sim-panel.show{display:flex;}
#sim-box{
  width:100%;background:#0f1923;border-radius:22px 22px 0 0;
  max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.5);
  animation:slideUp .35s cubic-bezier(.32,.72,0,1);
  padding-bottom:env(safe-area-inset-bottom,0);
}
#sim-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;
  background:linear-gradient(135deg,#1a2744,#0f1923);
  border-radius:22px 22px 0 0;
}
.sim-title{font-size:15px;font-weight:800;color:#fff}
.sim-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px}
#sim-scroll{overflow-y:auto;flex:1;padding:14px 14px 24px;background:#0f1923}
/* 로딩 */
.sim-loading-box{text-align:center;padding:40px 20px}
.sim-spinner{
  width:36px;height:36px;border:3px solid rgba(200,168,75,.2);
  border-top-color:#c8a84b;border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 14px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.sim-loading-text{font-size:13px;font-weight:700;color:#c8a84b;margin-bottom:4px}
.sim-loading-sub{font-size:11px;color:rgba(255,255,255,.4)}
/* 시나리오 카드 */
.sim-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;margin-bottom:12px;overflow:hidden;
}
.sim-card-head{
  display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;
}
.sim-card-icon{font-size:22px;flex-shrink:0}
.sim-card-title{font-size:13px;font-weight:700;color:#fff;flex:1}
.sim-card-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap}
.sim-card-arr{font-size:11px;color:rgba(255,255,255,.35);transition:transform .2s}
.sim-card.open .sim-card-arr{transform:rotate(90deg)}
.sim-card-body{display:none;padding:0 13px 13px;border-top:1px solid rgba(255,255,255,.07)}
.sim-card.open .sim-card-body{display:block}
/* 대화 버블 */
.sim-dialog{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.sim-bubble{
  max-width:85%;padding:8px 11px;border-radius:13px;
  font-size:11px;line-height:1.65;
}
.sim-bubble.left{
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);
  border-radius:4px 13px 13px 13px;align-self:flex-start;
}
.sim-bubble.right{
  background:#c8a84b;color:#fff;
  border-radius:13px 4px 13px 13px;align-self:flex-end;
  font-weight:600;
}
.sim-bubble-who{font-size:9px;font-weight:700;margin-bottom:3px;opacity:.6}
.sim-tip{
  background:rgba(200,168,75,.12);border:1px solid rgba(200,168,75,.3);
  border-radius:10px;padding:9px 11px;margin-top:8px;
}
.sim-tip-lbl{font-size:9px;font-weight:800;color:#c8a84b;margin-bottom:3px;letter-spacing:.05em}
.sim-tip-body{font-size:11px;color:rgba(255,255,255,.75);line-height:1.65;white-space:pre-line}
.sim-warn{
  background:rgba(255,100,50,.1);border:1px solid rgba(255,100,50,.3);
  border-radius:10px;padding:8px 11px;margin-top:8px;
}
.sim-warn-lbl{font-size:9px;font-weight:800;color:#ff7755;margin-bottom:3px}
.sim-warn-body{font-size:11px;color:rgba(255,255,255,.7);line-height:1.6;white-space:pre-line}
.sim-source{font-size:10px;color:rgba(255,255,255,.4);text-align:center;
  padding:5px 0 10px;letter-spacing:.02em}

let map, mapReady=false;

let curLine=null, pastLines=[];
let curMarkers=[];

function initMap(){
  // Leaflet 미로드(오프라인·CDN 차단) 시 안전하게 종료 — 앱 나머지는 정상 동작

    return;
  }
  try {
    map = L.map('map',{zoomControl:false, attributionControl:false}).setView([1.3521,103.8198],12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    L.control.zoom({position:'topright'}).addTo(map);
    mapReady = true;
  } catch(e) {
    mapReady = false;
    showMapNotice('지도 초기화 실패', '일정·교통편·시나리오는 정상 이용할 수 있습니다.');

}

// ── 경로 그리기 ─────────────────────────────────────────────
function archLine(from,to){
  // 두 점 사이 곡선 경유점 생성
  const pts=[];
  const steps=20;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const lat=from[0]+(to[0]-from[0])*t;
    const lng=from[1]+(to[1]-from[1])*t;
    // 중간 지점에서 약간 위로 올려 곡선 효과
    const arc=Math.sin(t*Math.PI)*0.03;
    pts.push([lat+arc,lng]);
  }
  return pts;
}


// ── 경로 그리기 애니메이션 ──────────────────────────────
var routeAnim = null;

function prefersStill(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  catch(e){ return false; }
}

// 진행 중인 애니메이션을 즉시 끝내고 정리
function cancelRouteAnim(){
  var h = routeAnim;
  if(!h) return;
  routeAnim = null;
  if(h.raf) cancelAnimationFrame(h.raf);
  if(h.finish) h.finish();
}

// 선두를 따라다니는 펄스 마커
function makeHead(color, latlng){
  if(!mapReady||typeof L==='undefined'||!map) return null;
  var ic = L.divIcon({className:'',
    html:'<div class="route-head" style="background:'+color+'"></div>',
    iconSize:[15,15], iconAnchor:[7.5,7.5]});
  return L.marker(latlng,{icon:ic,interactive:false,zIndexOffset:900}).addTo(map);
}

// line을 pts를 따라 순차적으로 그린다
//   opts.perSeg  구간당 ms (기본 380)
//   opts.maxMs   전체 상한 (기본 6000)
//   opts.total   전체 시간을 직접 지정 (perSeg/maxMs 무시)
//   opts.head    선두 마커
//   opts.onReach(i)  i번째 점에 도달했을 때
//   opts.onDone()    완료
function animatePath(line, pts, opts){
  opts = opts || {};
  var onReach = opts.onReach || function(){};
  var onDone  = opts.onDone  || function(){};
  var head    = opts.head || null;
  var n = pts.length;

  cancelRouteAnim();

  var done = false;
  var handle = {
    raf: null,
    finish: function(){
      if(done) return;
      done = true;
      try{ line.setLatLngs(pts); }catch(e){}
      while(reached < n-1){ reached++; onReach(reached); }
      if(head && map && map.hasLayer(head)) map.removeLayer(head);
      onDone();
    }
  };
  var reached = 0;

  if(n < 2){ routeAnim = handle; handle.finish(); routeAnim = null; return; }

  var total = opts.total
    || Math.min((opts.perSeg||380) * (n-1), opts.maxMs||6000);

  routeAnim = handle;
  line.setLatLngs([pts[0]]);
  onReach(0);

  if(prefersStill()){ handle.finish(); routeAnim = null; return; }

  var start = null;
  function frame(ts){
    if(routeAnim !== handle) return;
    if(start === null) start = ts;
    var t = (ts - start) / total;
    if(t > 1) t = 1;
    // 출발·도착은 살짝 느리게 (ease-in-out)
    var e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    var fpos = e * (n-1);
    var i = Math.floor(fpos);
    if(i > n-2) i = n-2;
    var f = fpos - i;
    var drawn = pts.slice(0, i+1);
    drawn.push([ pts[i][0] + (pts[i+1][0]-pts[i][0])*f,
                 pts[i][1] + (pts[i+1][1]-pts[i][1])*f ]);
    try{ line.setLatLngs(drawn); }catch(err){ handle.finish(); routeAnim=null; return; }
    if(head) head.setLatLng(drawn[drawn.length-1]);
    while(reached < i){ reached++; onReach(reached); }
    if(t < 1){ handle.raf = requestAnimationFrame(frame); }
    else { handle.finish(); routeAnim = null; }
  }
  handle.raf = requestAnimationFrame(frame);
}

// 이전 동선 보관 — 상한 초과 시 가장 오래된 것부터 제거
function pushPastLine(latlngs){
  if(!mapReady||typeof L==='undefined'||!map) return;
  var f = L.polyline(latlngs,{color:'#888',weight:2,opacity:0.25,lineCap:'round'}).addTo(map);
  pastLines.push(f);
  while(pastLines.length > PAST_LINE_MAX){
    var old = pastLines.shift();
    if(old && map.hasLayer(old)) map.removeLayer(old);
  }
}

function drawRoute(trObj){
  if(!mapReady||!trObj) return;
  const from=trObj.from, to=trObj.to;
  const isSamePoint=(from[0]===to[0]&&from[1]===to[1]);
  if(isSamePoint) return;

  // 이전 현재 경로 → 과거로 이동
  cancelRouteAnim();
  if(curLine){
    pushPastLine(curLine.getLatLngs());
    map.removeLayer(curLine); curLine=null;
  }

  const isLong=(Math.abs(from[0]-to[0])>1||Math.abs(from[1]-to[1])>1);
  const coords=isLong?archLine(from,to):[[from[0],from[1]],[to[0],to[1]]];

  const color=trObj.bc||'#ff6b35';
  const dash=trObj.mode==='transit'?'8,5':null;
  curLine=L.polyline([coords[0]],{color,weight:5,opacity:0.9,dashArray:dash,lineCap:'round',lineJoin:'round'}).addTo(map);

  // 출발 마커 먼저, 도착 마커는 선이 닿을 때
  curMarkers.forEach(m=>map.removeLayer(m)); curMarkers=[];
  curMarkers.push(pinIcon(from[0],from[1],'🔵','출발',color));

  map.fitBounds(L.latLngBounds(coords).pad(0.25),{animate:true,duration:0.8});

  animatePath(curLine, coords, {
    total: isLong ? 1500 : 950,
    head: makeHead(color, coords[0]),
    onReach: function(i){
      if(i === coords.length-1){
        curMarkers.push(pinIcon(to[0],to[1],'🔴','도착',color));
      }
    }
  });
}

function pinIcon(lat,lng,dot,lbl,color){
  if(!mapReady||typeof L==='undefined'||!map) return null;
  const ic=L.divIcon({className:'',
    html:`<div style="background:${color};width:30px;height:30px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-size:13px;
      box-shadow:0 2px 8px rgba(0,0,0,.3);border:3px solid #fff">${dot}</div>`,
    iconSize:[30,30],iconAnchor:[15,15]});
  return L.marker([lat,lng],{icon:ic}).bindPopup(`<b style="font-size:11px">${lbl}</b>`).addTo(map);
}

}

// 교통수단 DOM 빌드 — innerHTML 중첩 백틱 없이 createElement로
function buildTransportDOM(trKey){
  const wrap=document.getElementById('tropts_'+trKey);
  if(!wrap||wrap.children.length>0) return; // 이미 빌드됨
  const trs=TR[trKey];
  if(!trs) return;
  trs.forEach(function(tr){
    const uid='tropt_'+trKey+'_'+tr.id;
    // 카드 외부
    const card=document.createElement('div');
    card.className='tropt'; card.id=uid;
    // 헤더 행
    const head=document.createElement('div'); head.className='trh';
    const badge=document.createElement('span'); badge.className='trbg';
    badge.style.background=tr.bc; badge.textContent=tr.badge;
    const name=document.createElement('span'); name.className='trn'; name.textContent=tr.name;
    const arr=document.createElement('span'); arr.className='trarr'; arr.textContent='▶';
    head.appendChild(badge); head.appendChild(name); head.appendChild(arr);
    // 바디
    const body=document.createElement('div'); body.className='trbody';
    const desc=document.createElement('div');
    desc.style.cssText='white-space:pre-line;font-size:11px;line-height:1.65;color:#444;margin-bottom:8px';
    desc.textContent=tr.body;
    body.appendChild(desc);
    // 버튼 그룹
    const btns=document.createElement('div'); btns.className='nav-btns';
    // 앱내 경로 버튼
    const b1=document.createElement('button'); b1.className='nbtn nbtn-map';
    b1.textContent='🗺️ 앱내 경로';
    b1.addEventListener('click',function(e){e.stopPropagation();handleRoute(uid,trKey,tr.id);});
    btns.appendChild(b1);
    // 구글맵 네비 버튼
    const b2=document.createElement('button'); b2.className='nbtn nbtn-google';
    b2.textContent='🔵 구글맵 네비';
    b2.addEventListener('click',function(e){e.stopPropagation();openGoogleNav(trKey,tr.id);});
    btns.appendChild(b2);
    // Grab 버튼 (Grab인 경우만)
    if(tr.id==='grab'){
      const b3=document.createElement('button'); b3.className='nbtn nbtn-grab';
      b3.textContent='🚗 Grab 열기';
      b3.addEventListener('click',function(e){e.stopPropagation();openGrab(trKey);});
      btns.appendChild(b3);
    }
    body.appendChild(btns);
    card.appendChild(head); card.appendChild(body);
    // 카드 클릭 → 펼치기/접기
    card.addEventListener('click',function(){
      const isOpen=card.classList.contains('sel');
      wrap.querySelectorAll('.tropt').forEach(function(c){c.classList.remove('sel');});
      if(!isOpen) card.classList.add('sel');
    });
    wrap.appendChild(card);
  });
}

// 구글맵 길찾기 URL 만들기
function gmapDir(from, to, mode){
  return 'https://www.google.com/maps/dir/?api=1'
    + '&origin=' + from[0] + ',' + from[1]
    + '&destination=' + to[0] + ',' + to[1]
    + '&travelmode=' + (mode || 'driving');
}

// 여러 지점을 한 번에 — 경유지 포함 전체 경로
function gmapMulti(pts, mode){
  if(!pts || pts.length < 2) return null;
  var o = pts[0], d = pts[pts.length - 1];
  var mid = pts.slice(1, -1);
  // 구글맵 api=1은 경유지 최대 9개
  if(mid.length > 9) {
    var step = Math.ceil(mid.length / 9);
    mid = mid.filter(function(_, i){ return i % step === 0; }).slice(0, 9);
  }
  var url = 'https://www.google.com/maps/dir/?api=1'
    + '&origin=' + o[0] + ',' + o[1]
    + '&destination=' + d[0] + ',' + d[1]
    + '&travelmode=' + (mode || 'driving');
  if(mid.length) url += '&waypoints=' + encodeURIComponent(
    mid.map(function(p){ return p[0] + ',' + p[1]; }).join('|'));
  return url;
}

    const mq=encodeURIComponent(sp.name+' Singapore');
    dp.innerHTML=`<div class="dsbody" style="margin-bottom:7px;white-space:pre-line">${sp.desc}</div>
      <div class="tipbox"><div class="tiplbl">💡 실전 팁</div>

    // 장소 자체 보기

    card.appendChild(dp);
    card.querySelector('.sphead').addEventListener('click',()=>{
      const open=dp.classList.toggle('open');
      if(open) flyTo(sp.lat,sp.lng,16);
    });
    wrap.appendChild(card);
  });
  ci.appendChild(wrap);
}

function drawMondayAll(route){
  if(!mapReady||typeof L==='undefined'||!map) return;
  cancelRouteAnim();
  if(curLine){map.removeLayer(curLine);curLine=null;}
  curMarkers.forEach(m=>map.removeLayer(m)); curMarkers=[];
  const pts=route.spots.map(s=>[s.lat,s.lng]);
  if(!pts.length) return;

  curLine=L.polyline([pts[0]],{color:route.color,weight:4,opacity:0.85,lineCap:'round',lineJoin:'round'}).addTo(map);
  map.fitBounds(L.latLngBounds(pts).pad(0.25),{animate:true});

  animatePath(curLine, pts, {
    perSeg: 340, maxMs: 5500,
    head: makeHead(route.color, pts[0]),
    onReach: function(i){
      const sp = route.spots[i];
      curMarkers.push(pinIcon(pts[i][0],pts[i][1],sp.icon,(i+1)+'. '+sp.name,route.color));
    }
  });
}

function drawDayRoute(dayIdx){
  var d = DAYS[dayIdx];
  if(!d) return;
  if(!mapReady||typeof L==='undefined'||!map){ closePreview(); return; }
  // 위치 있는 아이템 추출
  var pts = d.items.filter(function(it){ return it.lat && it.lng; });
  if(pts.length < 2){ closePreview(); return; }

  // 이전 경로 → 흐리게
  cancelRouteAnim();
  if(curLine){
    pushPastLine(curLine.getLatLngs());
    map.removeLayer(curLine); curLine=null;
  }
  curMarkers.forEach(function(m){map.removeLayer(m);}); curMarkers=[];

  var latlngs = pts.map(function(it){return [it.lat, it.lng];});
  var color = d.bc || '#ff6b35';

  curLine = L.polyline([latlngs[0]], {
    color: color, weight:4, opacity:0.85,
    lineCap:'round', lineJoin:'round'
  }).addTo(map);

  // 전체 범위를 먼저 잡아두고, 그 위에 선이 그려지는 걸 보여준다
  map.fitBounds(L.latLngBounds(latlngs).pad(0.2),{animate:true});

  // i번째 지점에 도달할 때마다 마커 + 직전 구간 화살표를 얹는다
  function placeAt(i){
    var it = pts[i];
    var c = DOT_COLOR[it.type]||'#888';
    if(i > 0){
      var mid = [(latlngs[i-1][0]+latlngs[i][0])/2, (latlngs[i-1][1]+latlngs[i][1])/2];
      var aic = L.divIcon({className:'',
        html:'<div style="font-size:12px;color:'+color+';filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))">➤</div>',
        iconAnchor:[6,8]});
      curMarkers.push(L.marker(mid,{icon:aic,interactive:false}).addTo(map));
    }
    var ic=L.divIcon({className:'',
      html:'<div style="background:'+c+';width:28px;height:28px;border-radius:50%;'
        +'display:flex;align-items:center;justify-content:center;font-size:12px;'
        +'box-shadow:0 2px 8px rgba(0,0,0,.3);border:2.5px solid #fff">'+it.icon+'</div>',
      iconSize:[28,28],iconAnchor:[14,14]});
    curMarkers.push(L.marker([it.lat,it.lng],{icon:ic}).addTo(map)
      .bindPopup('<b style="font-size:11px">'+it.time+' '+it.title+'</b>'));
  }

  animatePath(curLine, latlngs, {
    perSeg: 380, maxMs: 6000,
    head: makeHead(color, latlngs[0]),
    onReach: placeAt
  });

  closePreview();
}

function openGmapsDay(dayIdx){
  var d = DAYS[dayIdx];
  if(!d) return;
  var pts = d.items.filter(function(it){ return it.lat && it.lng; });
  if(pts.length < 2) return;
  // 구글맵 멀티스톱: origin/destination + waypoints
  var origin = pts[0].lat+','+pts[0].lng;
  var dest = pts[pts.length-1].lat+','+pts[pts.length-1].lng;
  var waypts = pts.slice(1,-1).map(function(p){return p.lat+','+p.lng;}).join('|');
  var url = 'https://www.google.com/maps/dir/?api=1'
    +'&origin='+origin
    +'&destination='+dest
    +(waypts?'&waypoints='+encodeURIComponent(waypts):'')
    +'&travelmode=driving';
  window.open(url,'_blank');
  closePreview();
}

function buildDayContext(dayIdx){
  var d = DAYS[dayIdx];
  var lines = [];
  lines.push('날짜: ' + d.title + ' (' + d.sub + ')');
  lines.push('팀: 김상범(소장/비즈니스석), 정재수(수석), 임상철(책임), 류환재(선임)');
  lines.push('소속: 해안건축 데이터센터팀 — 건축설계 전문가');
  lines.push('');
  lines.push('당일 일정:');
  (d.items||[]).forEach(function(it,i){
    var line = (i+1)+'. ['+it.time+'] '+it.title+' @ '+it.loc;
    if(it.warn) line += ' ⚠️'+it.warn;
    lines.push(line);
    if(it.secs) it.secs.forEach(function(s){ lines.push('   '+s.t+': '+s.b.replace(/<[^>]+>/g,'')); });
  });
  return lines.join('\n');
}

// 내장 시나리오 즉시 표시
function showBuiltinScenario(dayIdx, delay){
  setTimeout(function(){
    var data = SCENARIOS[dayIdx];
    var ld = document.getElementById('sim-loading');
    if(ld) ld.style.display = 'none';
    if(data) renderSimResult(data, dayIdx, false);
    else renderSimFallback(dayIdx);
  }, delay || 0);
}

// 하이브리드: 웹 배포 시 Claude API 실시간 생성, 파일/오프라인 시 내장 시나리오
function runSimulation(dayIdx){
  var isWeb = location.protocol === 'http:' || location.protocol === 'https:';
  if(!isWeb || !navigator.onLine){
    showBuiltinScenario(dayIdx, 600);
    return;
  }

  var lt = document.getElementById('sim-loading-text');
  if(lt) lt.textContent = 'Claude가 시나리오를 생성 중...';

  var done = false;
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  // 12초 내 응답 없으면 내장 시나리오로 전환
  var timer = setTimeout(function(){
    if(done) return;
    done = true;
    if(ctrl) try{ ctrl.abort(); }catch(e){}
    showBuiltinScenario(dayIdx, 0);
  }, 12000);

  fetch('/api/claude', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ dayIdx: dayIdx, context: buildDayContext(dayIdx) }),
    signal: ctrl ? ctrl.signal : undefined
  })
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(result){
    if(done) return;
    done = true; clearTimeout(timer);
    var ld = document.getElementById('sim-loading');
    if(ld) ld.style.display = 'none';
    if(result && result.scenarios && result.scenarios.length) renderSimResult(result, dayIdx, true);
    else showBuiltinScenario(dayIdx, 0);
  })
  .catch(function(){
    if(done) return;
    done = true; clearTimeout(timer);
    showBuiltinScenario(dayIdx, 0);
  });
}

function renderSimResult(result, dayIdx, isLive){
  var d = DAYS[dayIdx];
  var content = document.getElementById('sim-content');
  content.innerHTML = '';

  // 시나리오 출처 표시
  var src = document.createElement('div');
  src.className = 'sim-source';
  src.textContent = isLive ? '⚡ Claude 실시간 생성' : '📦 내장 시나리오 (오프라인 이용 가능)';
  content.appendChild(src);

  // 재생성 버튼
  if(location.protocol === 'http:' || location.protocol === 'https:'){
    var reBtn = document.createElement('button');
    reBtn.className = 'sim-btn';
    reBtn.innerHTML = '🔄 시나리오 다시 생성';
    reBtn.addEventListener('click', function(){
      document.getElementById('sim-content').innerHTML = '';
      document.getElementById('sim-loading').style.display = 'block';
      runSimulation(dayIdx);
    });
    content.appendChild(reBtn);
  }

  (result.scenarios || []).forEach(function(sc, idx){
    var card = document.createElement('div');
    card.className = 'sim-card';

    // 헤더
    var head = document.createElement('div'); head.className = 'sim-card-head';
    var icon = document.createElement('div'); icon.className = 'sim-card-icon'; icon.textContent = sc.icon||'💬';
    var title = document.createElement('div'); title.className = 'sim-card-title'; title.textContent = sc.title||'';
    var badge = document.createElement('div'); badge.className = 'sim-card-badge';
    badge.textContent = sc.badge||''; badge.style.background = sc.badgeColor||'#555'; badge.style.color='#fff';
    var arr = document.createElement('div'); arr.className = 'sim-card-arr'; arr.textContent = '▶';
    head.appendChild(icon); head.appendChild(title); head.appendChild(badge); head.appendChild(arr);

    // 바디
    var body = document.createElement('div'); body.className = 'sim-card-body';

    // 대화
    if(sc.dialogs && sc.dialogs.length){
      var dlg = document.createElement('div'); dlg.className = 'sim-dialog';
      sc.dialogs.forEach(function(dl){
        var bub = document.createElement('div');
        bub.className = 'sim-bubble ' + (dl.side||'left');
        var who = document.createElement('div'); who.className = 'sim-bubble-who'; who.textContent = dl.who||'';
        var txt = document.createElement('div'); txt.textContent = dl.text||'';
        bub.appendChild(who); bub.appendChild(txt);
        dlg.appendChild(bub);
      });
      body.appendChild(dlg);
    }
    // 팁
    if(sc.tip){
      var tipEl = document.createElement('div'); tipEl.className = 'sim-tip';
      var tipLbl = document.createElement('div'); tipLbl.className = 'sim-tip-lbl'; tipLbl.textContent = '💡 실전 팁';
      var tipTxt = document.createElement('div'); tipTxt.className = 'sim-tip-body'; tipTxt.textContent = sc.tip;
      tipEl.appendChild(tipLbl); tipEl.appendChild(tipTxt);
      body.appendChild(tipEl);
    }
    // 경고
    if(sc.warn){
      var warnEl = document.createElement('div'); warnEl.className = 'sim-warn';
      var warnLbl = document.createElement('div'); warnLbl.className = 'sim-warn-lbl'; warnLbl.textContent = '⚠️ 주의';
      var warnTxt = document.createElement('div'); warnTxt.className = 'sim-warn-body'; warnTxt.textContent = sc.warn;
      warnEl.appendChild(warnLbl); warnEl.appendChild(warnTxt);
      body.appendChild(warnEl);
    }

    card.appendChild(head); card.appendChild(body);
    // 토글
    head.addEventListener('click', function(){
      card.classList.toggle('open');
      arr.style.transform = card.classList.contains('open') ? 'rotate(90deg)' : '';
    });
    // 첫 번째 카드 자동 오픈
    if(idx === 0){ card.classList.add('open'); arr.style.transform = 'rotate(90deg)'; }
    content.appendChild(card);
  });
}

function renderSimFallback(dayIdx){
  var content = document.getElementById('sim-content');
  var msg = document.createElement('div');
  msg.style.cssText = 'text-align:center;padding:30px 20px;color:rgba(255,255,255,.5)';

}

// 맛집 위치를 지도에 표시
function setFoodMarker(lat, lng, name){
  if(!mapReady || typeof L === 'undefined' || !map) return;
  curMarkers.forEach(function(m){ map.removeLayer(m); });
  curMarkers = [];
  var mk_ = pinIcon(lat, lng, '🍜', name, '#c45e0a');
  if(mk_) curMarkers.push(mk_);
  map.flyTo([lat, lng], 16, { animate:true, duration:0.7 });
}

// ── 준비 체크리스트 ─────────────────────────────────────────
var CK_KEY = 'sg_checklist_v1';
var ckState = {};
var ckOpenGroups = {};

function ckLoad(){
  try { ckState = JSON.parse(localStorage.getItem(CK_KEY) || '{}') || {}; }
  catch(e) { ckState = {}; }   // 저장이 막힌 환경에서도 세션 내에서는 동작
}
function ckSave(){
  try { localStorage.setItem(CK_KEY, JSON.stringify(ckState)); } catch(e) {}
}
function ckTotals(){
  var total = 0, done = 0;
  CHECKLIST.forEach(function(g){
    g.items.forEach(function(it){ total++; if(ckState[it.id]) done++; });
  });
  return { total: total, done: done };
}
function ckGroupTotals(g){
  var done = 0;
  g.items.forEach(function(it){ if(ckState[it.id]) done++; });
  return { total: g.items.length, done: done };
}

function renderChecklist(ci){
  ckLoad();

  // 상단 진행률
  var t = ckTotals();
  var pct = t.total ? Math.round(t.done / t.total * 100) : 0;
  var hero = mk('div','ck-hero');
  hero.innerHTML =
      '<div class="ck-hero-t">출발 전 준비 체크리스트</div>'
    + '<div class="ck-hero-s">9/27 출발까지 준비할 것들입니다. 체크는 이 기기에 저장되니 나눠서 하셔도 됩니다.</div>'
    + '<div class="ck-bar-wrap"><div class="ck-bar" id="ckBar"></div></div>'
    + '<div class="ck-bar-lbl">'
    +   '<span><span class="ck-bar-n" id="ckDone">' + t.done + '</span> / ' + t.total + ' 완료</span>'
    +   '<button class="ck-reset" id="ckReset">전체 해제</button>'
    + '</div>';
  ci.appendChild(hero);
  setTimeout(function(){
    var bar = document.getElementById('ckBar');
    if(bar) bar.style.width = pct + '%';
  }, 60);
  document.getElementById('ckReset').addEventListener('click', function(){
    ckState = {}; ckSave();
    renderDay(curDay);
  });

  // 그룹
  CHECKLIST.forEach(function(g, gi){
    var gt = ckGroupTotals(g);
    var allDone = gt.done === gt.total;
    // 기본 펼침: 첫 미완료 그룹
    if (ckOpenGroups[gi] === undefined) ckOpenGroups[gi] = !allDone && !CHECKLIST.slice(0, gi).some(function(pg, pi){
      var p = ckGroupTotals(pg); return p.done < p.total && ckOpenGroups[pi] !== false;
    });

    var box = mk('div','ck-group' + (ckOpenGroups[gi] ? ' open' : ''));
    var head = mk('div','ck-ghead');
    head.innerHTML =
        '<div class="ck-gicon">' + g.icon + '</div>'
      + '<div class="ck-gname">' + g.group + '</div>'
      + '<div class="ck-gcount' + (allDone ? ' done' : '') + '">' + gt.done + '/' + gt.total + '</div>'
      + '<div class="ck-garr">▶</div>';
    head.addEventListener('click', function(){
      ckOpenGroups[gi] = !box.classList.contains('open');
      box.classList.toggle('open');
    });
    box.appendChild(head);

    var body = mk('div','ck-body');
    g.items.forEach(function(it){
      var row = mk('div','ck-item' + (ckState[it.id] ? ' on' : ''));
      row.innerHTML =
          '<div class="ck-box">✓</div>'
        + '<div class="ck-txt">'
        +   '<div class="ck-t">' + it.t + (it.critical ? '<span class="ck-req">필수</span>' : '') + '</div>'
        +   '<div class="ck-d">' + it.d + '</div>'
        + '</div>';
      row.addEventListener('click', function(){
        ckState[it.id] = !ckState[it.id];
        if(!ckState[it.id]) delete ckState[it.id];
        ckSave();
        row.classList.toggle('on', !!ckState[it.id]);
        ckRefreshCounts();
      });
      body.appendChild(row);
    });
    box.appendChild(body);
    ci.appendChild(box);
  });

  var note = mk('div','ck-note');
  note.textContent = '체크 상태는 이 기기에만 저장됩니다. 팀원은 각자 체크하세요.';
  ci.appendChild(note);
}

// 체크할 때마다 전체를 다시 그리지 않고 숫자만 갱신
function ckRefreshCounts(){
  var t = ckTotals();
  var bar = document.getElementById('ckBar');
  var dn = document.getElementById('ckDone');
  if(bar) bar.style.width = (t.total ? Math.round(t.done / t.total * 100) : 0) + '%';
  if(dn) dn.textContent = t.done;
  document.querySelectorAll('.ck-group').forEach(function(box, gi){
    var g = CHECKLIST[gi]; if(!g) return;
    var gt = ckGroupTotals(g);
    var c = box.querySelector('.ck-gcount');
    if(c){ c.textContent = gt.done + '/' + gt.total;
           c.classList.toggle('done', gt.done === gt.total); }
  });
}

function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}

// ── 딥링크 네비게이션 ─────────────────────────────────────────
// 교통수단 모드 → 구글맵 travelmode 매핑
const GM_MODE = {driving:'driving', transit:'transit', walking:'walking'};

function openGoogleNav(trKey, trId){
  const trs = TR[trKey];
  if(!trs) return;
  const tr = trs.find(t=>t.id===trId);
  if(!tr) return;
  const from = tr.from; // [lat,lng]
  const to   = tr.to;
  const mode = GM_MODE[tr.mode] || 'driving';

  // 구글맵 딥링크 — 앱 설치 시 앱 열림, 미설치 시 웹 열림
  // 형식: https://www.google.com/maps/dir/?api=1&origin=lat,lng&destination=lat,lng&travelmode=MODE
  const url = `https://www.google.com/maps/dir/?api=1`
    + `&origin=${from[0]},${from[1]}`
    + `&destination=${to[0]},${to[1]}`
    + `&travelmode=${mode}`;
  window.open(url, '_blank');
}

function openGrab(trKey){
  const trs = TR[trKey];
  if(!trs) return;
  const tr = trs.find(t=>t.id==='grab');
  if(!tr) return;
  const to = tr.to;

  // Grab 딥링크 — 목적지 좌표로 앱 열기
  // grab:// 스킴: 앱 설치 시 앱 열림
  // 폴백: Grab 웹 (모바일 브라우저)
  const grabDeep = `grab://open?screenType=BOOKING&dropoffLatitude=${to[0]}&dropoffLongitude=${to[1]}`;
  const grabWeb  = `https://grab.onelink.me/2695613898?af_dp=${encodeURIComponent(grabDeep)}&af_web_dp=https://www.grab.com/sg/`;

  // 앱 딥링크 시도 → 300ms 후 미설치면 앱스토어/웹으로
  const iframe = document.createElement('iframe');
  iframe.style.display='none';
  iframe.src = grabDeep;
  document.body.appendChild(iframe);
  setTimeout(()=>{
    document.body.removeChild(iframe);
    // 앱 전환 안 됐으면 웹으로
    window.open(grabWeb,'_blank');
  }, 1500);
}
